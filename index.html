    const comma = s.indexOf(', ');
    if (comma > 0 && comma < 28) return [s.slice(0, comma), s.slice(comma + 2)];
    const m = /^([A-Z][\w'.-]*(?: [A-Z][\w'.-]*)?) (the .+)$/.exec(s);
    if (m) return [m[1], m[2]];
    return [s, ''];
  }
  function vChip(c, v) { return `<span class="vchip ${VC[v]}">${L[v]}</span>`; }
  function suspectCard(c, v, o) {
    o = o || {};
    const [nm, sub] = splitName(c.verdicts[v].label);
    const tagName = o.button ? 'button' : 'div';
    return `<${tagName} class="sus ${VC[v]} ${o.cls || ''}" ${o.attrs || ''}>
      <span class="sus-top"><span class="sus-l" aria-hidden="true">${L[v]}</span><span class="sus-ic" aria-hidden="true">${suspectIcon(c.verdicts[v].label)}</span></span>
      <span class="sus-nm"><span class="sr">${L[v]}. </span>${esc(nm)}</span>
      ${sub ? `<span class="sus-sub">${esc(sub)}</span>` : ''}
      ${o.detail ? `<span class="sus-why">${esc(c.verdicts[v].detail)}</span>` : ''}
      ${o.extra || ''}
    </${tagName}>`;
  }
  function suspectGrid(c, opts, o) {
    return `<div class="sus-grid">${(opts || [0, 1, 2, 3]).map(v => suspectCard(c, v, typeof o === 'function' ? o(v) : o)).join('')}</div>`;
  }

  // Evidence: each piece is its own card with a picture, a short heading and a stamp.
  const EV_ICONS = [
    [/\b(camera|cam|photos?|video|footage|selfie|still|nanny-cam|doorbell)\b/i, '📷'],
    [/\b(text|phone|group chat|search|lock screen|chat)\b/i, '📱'],
    [/\b(flight|airline|boarding|cruise|passport|ride-share)\b/i, '✈️'],
    [/\b(hospital|pharmacy|lab|vet|wristband|breath test|x-rays?|prescription|birth record|blood|discharge)\b/i, '🩺'],
    [/\b(receipt|invoice|bank|slip|pawn|tab|wired?|check|folio|loan|paid|deposited|card audit|ticket)\b/i, '🧾'],
    [/\b(gps|location|toll|gate log|badge log|collar)\b/i, '📍'],
    [/\b(email|letter|memo|note|napkin|flyer|sticky)\b/i, '✉️'],
    [/\b(key|lock|keycard|forced)\b/i, '🔑'],
    [/\b(log|audit|records?|calendar|booking|minutes|timesheet|time clock|sign-in|report|background check|filings)\b/i, '📋'],
    [/\b(sworn|statement|witness(es)?|overheard|said|says|saw)\b/i, '🗣️'],
  ];
  function splitEx(text) {
    let s = String(text || '').replace(/^Exhibit [A-Z]:\s*/, '');
    const k = s.indexOf(': ');
    if (k >= 2 && k <= 52 && !/[.!?] |[!?]/.test(s.slice(0, k))) return { head: s.slice(0, k), body: s.slice(k + 2) };
    return { head: '', body: s };
  }
  function evIcon(text) {
    const { head, body } = splitEx(text);
    for (const src of [head, body]) { if (!src) continue; const hit = EV_ICONS.find(([re]) => re.test(src)); if (hit) return hit[1]; }
    return '📄';
  }
  function stampHTML(c, ev) {
    const out = ev.kind !== 'points_to';
    return `<span class="ev-stamp ${out ? 'out' : 'to'} ${VC[ev.v]}">${out ? '✕ Rules out' : '➜ Points to'} ${L[ev.v]}<span class="ev-stamp-nm"> · ${esc(splitName(c.verdicts[ev.v].label)[0])}</span></span>`;
  }
  function evCard(c, text, o) {
    o = o || {};
    const { head, body } = splitEx(text);
    return `<div class="ev ${o.cls || ''}">
      <span class="ev-ic" aria-hidden="true">${o.icon || evIcon(text)}</span>
      <div class="ev-body">${o.label ? `<span class="ev-label">${esc(o.label)}</span>` : ''}${head ? `<span class="ev-head">${esc(head)}</span>` : ''}<span class="ev-txt">${esc(body)}</span>${o.stamp ? stampHTML(c, o.stamp) : ''}</div>
    </div>`;
  }
  function publicCards(c) {
    return `<div class="ev-list">${c.public.map((p, k) => evCard(c, p, { label: 'Known fact ' + (k + 1) })).join('')}</div>`;
  }

  // The story as a few short beats instead of one long paragraph (the suspects get their own cards).
  const ABBR = /\b(a\.m|p\.m|Mr|Mrs|Ms|Dr|St|Jr|Sr|No|vs|etc|Lt|Sgt|Capt|U\.S)$/i;
  function beats(c) {
    const s = String(c.story), out = [];
    let start = 0;
    for (let k = 0; k < s.length; k++) {
      const ch = s[k];
      if ((ch === '.' || ch === '!' || ch === '?') && (k + 1 >= s.length || (s[k + 1] === ' ' && /[A-Z'"‘“0-9$]/.test(s[k + 2] || '')))) {
        const piece = s.slice(start, k + 1).trim();
        if (ch === '.' && ABBR.test(piece.slice(0, -1))) continue;
        out.push(piece); start = k + 1;
      }
    }
    const rest = s.slice(start).trim(); if (rest) out.push(rest);
    return out.filter(b => !/^The suspects?:/i.test(b) && !/^(Suspects|The choices):/i.test(b));
  }

  function caseFile(c, mode) {
    const full = mode === 'full';
    const r = E.roleCounts(G.players.length);
    const opts = G.cur.round === 2 && !full ? G.cur.options : null;
    const story = `<ol class="beats">${beats(c).map(b => `<li>${esc(b)}</li>`).join('')}</ol>`;
    return `<article class="file">
      <div class="caption"><span>${esc(courtName(c))}</span><span>Case ${G.k + 1} of ${G.caseIds.length}</span></div>
      <span class="stamp">${c.tone === 'absurd' ? 'Absurd' : 'Serious'}</span>
      <h2>${esc(c.title)}</h2>
      <p class="charge"><span class="q-ic" aria-hidden="true">❓</span>${esc(c.charge)}</p>
      ${full ? `<section class="sect"><h3>What happened</h3>${story}</section>` :
        `<details class="story-fold"${ui.storyOpen ? ' open' : ''}><summary>What happened</summary>${story}</details>`}
      <section class="sect"><h3>The suspects${opts ? ' still standing' : ''}</h3>${suspectGrid(c, opts, { detail: true })}</section>
      <section class="sect"><h3>What everyone knows</h3>${publicCards(c)}</section>
      ${full ? `<p class="small-print sect">At this table: 1 Insider, ${r.fixers} Fixer${r.fixers > 1 ? 's' : ''} and ${r.jurors} Juror${r.jurors > 1 ? 's' : ''}.</p>` : ''}
    </article>`;
  }
  function verdictList(c, opts) { return suspectGrid(c, opts, { detail: true }); }

  // Where we are in the case.
  const STEPS = [['The case', ['intro']], ['Your secret', ['brief']], ['Argue', ['deliberate', 'hung']], ['Vote', ['ballot']], ['Verdict', ['verdict', 'appeal', 'truth', 'unmask', 'standings']]];
  function phaseStrip() {
    if (!G || !G.cur) return '';
    const at = STEPS.findIndex(s => s[1].includes(G.phase));
    if (at < 0) return '';
    return `<ol class="steps" aria-label="Where we are">${STEPS.map((s, k) => `<li class="${k < at ? 'done' : k === at ? 'now' : ''}"${k === at ? ' aria-current="step"' : ''}>${s[0]}</li>`).join('')}</ol>`;
  }

  function topbar(label) {
    return `<div class="topbar"><span class="crumb">${esc(label || '')}</span>
      <button class="icon-btn" data-act="menu" aria-label="Menu">Menu</button></div>${phaseStrip()}`;
  }

  function dots(total, done) {
    return '<div class="dots" aria-hidden="true">' + [...Array(total)].map((_, k) => `<span class="${k < done ? 'on' : ''}"></span>`).join('') + '</div>';
  }

  const LAMP = `<svg class="lamp" viewBox="0 0 260 150" role="img" aria-label="A green banker's lamp">
    <defs>
      <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9a6c"/><stop offset=".45" stop-color="#1d5b3e"/><stop offset="1" stop-color="#0d2c1e"/></linearGradient>
      <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6a2a"/><stop offset=".45" stop-color="#ecd28b"/><stop offset="1" stop-color="#8a6a2a"/></linearGradient>
      <radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#ffe2a6" stop-opacity=".75"/><stop offset="1" stop-color="#ffe2a6" stop-opacity="0"/></radialGradient>
    </defs>
    <ellipse cx="130" cy="96" rx="118" ry="40" fill="url(#glow)"/>
    <path d="M38 64 Q130 4 222 64 L214 76 Q130 30 46 76 Z" fill="url(#shade)"/>
    <path d="M38 64 Q130 4 222 64" fill="none" stroke="#9fe0bd" stroke-opacity=".5" stroke-width="2"/>
    <rect x="40" y="72" width="180" height="7" rx="3.5" fill="url(#brass)"/>
    <rect x="124" y="80" width="12" height="46" fill="url(#brass)"/>
    <rect x="160" y="78" width="4" height="22" fill="url(#brass)"/><circle cx="162" cy="103" r="4" fill="#ecd28b"/>
    <path d="M70 126 Q130 112 190 126 L196 140 Q130 132 64 140 Z" fill="url(#brass)"/>
  </svg>`;

  const GAVEL = `<svg viewBox="0 0 300 200" aria-hidden="true">
    <defs>
      <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a33"/><stop offset=".5" stop-color="#5a361c"/><stop offset="1" stop-color="#2e1a0c"/></linearGradient>
      <linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6a2a"/><stop offset=".5" stop-color="#ecd28b"/><stop offset="1" stop-color="#8a6a2a"/></linearGradient>
    </defs>
    <ellipse cx="190" cy="186" rx="96" ry="10" fill="#000" opacity=".45"/>
    <rect x="120" y="160" width="140" height="24" rx="6" fill="url(#gw)"/>
    <rect x="134" y="152" width="112" height="12" rx="5" fill="#6e4628"/>
    <g class="gavel">
      <rect x="40" y="128" width="190" height="12" rx="6" fill="url(#gw)" transform="rotate(-8 230 134)"/>
      <g transform="rotate(-8 230 134)">
        <rect x="196" y="92" width="74" height="40" rx="10" fill="url(#gw)"/>
        <rect x="206" y="92" width="8" height="40" fill="url(#gb)"/><rect x="252" y="92" width="8" height="40" fill="url(#gb)"/>
      </g>
    </g>
  </svg>`;

  // ---------------- Screens ----------------
  function vHome() {
    const g = Store.data.game;
    return `<div class="bench">
      <div class="topbar"><span></span><button class="icon-btn" data-act="settings" aria-label="Settings">Settings</button></div>
      <div class="marquee">${LAMP}
        <div class="plaque"><div class="sub">The People's Party Game</div><h1>Hung Jury</h1></div>
        <p class="tagline">One of you knows the truth. One of you is fixing the jury. Everyone else has about four minutes to sort it out.</p>
      </div>
      <div class="stack">
        ${g ? `<button class="btn brass block" data-act="resume">Resume trial · case ${g.k + 1} of ${g.caseIds.length}</button>` : ''}
        <button class="btn ${g ? 'wood' : 'brass'} block" data-act="setup">${g ? 'New trial' : 'Convene a jury'}</button>
        <button class="btn wood block" data-act="rules">How to play</button>
      </div>
      <p class="note">1 to 10 people · computer jurors fill the empty seats · one device · adults only</p>

  function setupInfo() {
    const names = Store.data.roster.map(cleanName).filter(Boolean);
    const h = names.length;
    const dup = new Set(names.map(x => x.toLowerCase())).size !== h;
    const bots = h ? botCount(h) : 0;
    const total = h + bots;
    const valid = h >= 1 && total >= E.MIN_PLAYERS && total <= E.MAX_PLAYERS && !dup;
    const rc = E.roleCounts(Math.max(3, total));
    const msg = dup ? 'Two players share a name. Add an initial.' : h < 1 ? 'Type at least one name.' : total > E.MAX_PLAYERS ? 'Ten seats at most.'
      : `${h} ${h === 1 ? 'person' : 'people'}${bots ? ` and ${bots} computer juror${bots > 1 ? 's' : ''}` : ''}: 1 Insider, ${rc.fixers} Fixer${rc.fixers > 1 ? 's' : ''}, ${rc.jurors} Juror${rc.jurors > 1 ? 's' : ''} each case.`;
    return { names, h, bots, total, valid, msg, dup };
  }
  function vSetup() {
    const r = Store.data.roster;
    const info = setupInfo();
    const valid = info.valid, dup = info.dup;
    const nn = Math.max(3, Math.min(10, info.total || 5));
    const cases = S().cases || E.defaultCases(nn);
    const secs = S().timer || autoTimer(nn, info.bots);
    const seats = r.map((v, i) => `<div class="seat">
        <span class="seat-no">${i + 1}</span>
        <input id="seat-${i}" data-seat="${i}" value="${esc(v)}" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="${i === 0 ? 'Your name' : 'Next seat'}" aria-label="Player in seat ${i + 1}">
        <button class="mini" data-act="seat-up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">&#8593;</button>
        <button class="mini" data-act="seat-down" data-i="${i}" ${i === r.length - 1 ? 'disabled' : ''} aria-label="Move down">&#8595;</button>
        <button class="mini" data-act="seat-del" data-i="${i}" ${r.length <= 1 ? 'disabled' : ''} aria-label="Remove seat">&times;</button>
      </div>`).join('');
    const tone = S().tone;
    return `<div class="bench">
      <div class="topbar"><button class="icon-btn" data-act="home">&#8592; Back</button><span class="crumb">Empanel the jury</span></div>
      <div class="setup-grid">
        <section class="panel trim stack">
          <span class="field-label">The people, in seating order</span>
          <p class="muted" style="font-size:var(--s-1)">Playing alone? Just type your name. With more than one person, the device travels around the table in this order. Empty seats are skipped.</p>
          <div class="roster">${seats}</div>
          <button class="btn wood small" data-act="seat-add" ${r.length >= E.MAX_PLAYERS ? 'disabled' : ''}>Add a seat</button>
          <span class="field-label">Computer jurors</span>
          <div class="stepper"><button class="mini" data-act="bots" data-d="-1" aria-label="Fewer computer jurors">&minus;</button><span class="val" id="bots-val">${info.bots}</span><button class="mini" data-act="bots" data-d="1" aria-label="More computer jurors">+</button>
            <span class="estimate">${S().bots == null ? 'auto' : '<button class="mini" style="width:auto;padding:0 10px" data-act="bots-auto">Auto</button>'}</span></div>
          <p class="bots-line">They argue, bluff, accuse and vote like everyone else, and they can be the Insider or the Fixer too.</p>
          <p class="note" id="setup-msg">${esc(info.msg)}</p>
        </section>
        <section class="panel trim stack">
          <span class="field-label">The docket</span>
          <div class="seg" role="group" aria-label="Kind of cases">
            <button data-act="tone" data-v="mix" aria-pressed="${tone === 'mix'}">A mix</button>
            <button data-act="tone" data-v="absurd" aria-pressed="${tone === 'absurd'}">Absurd</button>
            <button data-act="tone" data-v="serious" aria-pressed="${tone === 'serious'}">Serious</button>
          </div>
          <span class="field-label">Cases tonight</span>
          <div class="stepper"><button class="mini" data-act="cases" data-d="-1" aria-label="Fewer cases">&minus;</button><span class="val" id="cases-val">${cases}</span><button class="mini" data-act="cases" data-d="1" aria-label="More cases">+</button>
            <span class="estimate">about ${E.estimateMinutes(nn, cases)} min${S().cases ? '' : ' (auto)'}</span></div>
          <span class="field-label">Deliberation clock</span>
          <div class="stepper"><button class="mini" data-act="timer" data-d="-15" aria-label="Less time">&minus;</button><span class="val">${mmss(secs)}</span><button class="mini" data-act="timer" data-d="15" aria-label="More time">+</button>
            <span class="estimate">${S().timer ? '<button class="mini" style="width:auto;padding:0 10px" data-act="timer-auto">Auto</button>' : 'auto for ' + nn + ' seats'}</span></div>
          <button class="btn brass block" data-act="begin" ${valid ? '' : 'disabled'}>Call court to order</button>
        </section>
      </div>
    </div>`;
  }

  function vIntro() {
    const c = curCase();
    return `<div class="bench">
      ${topbar('Case ' + (G.k + 1) + ' of ' + G.caseIds.length)}
      <section class="panel trim center stack tight">
        <p class="lead">${solo() ? 'You are' : `<strong>${esc(name(G.cur.fore))}</strong> is`} the Foreperson for this case.</p>
        <p class="muted">${solo() ? 'Rap the gavel and read the file. The computer jurors have read it too.' : 'Foreperson: rap the gavel, then read the file aloud, starting with the charge.'}</p>
        <div class="row" style="justify-content:center"><button class="btn wood small" data-act="all-rise">&#9878; All rise</button></div>
      </section>
      ${caseFile(c, 'full')}
      <button class="btn brass block" data-act="brief-start">${solo() ? 'Open my summons' : 'Begin the secret briefing'}</button>
      <p class="note">${solo() ? 'Your secret role and exhibit are next.' : `Next, the device goes to each person in turn, starting with ${esc(name(G.cur.fore))}.`}</p>
    </div>`;
  }

  function passScreen(who, done, total, verb, hint) {
    return `<div class="bench">
      ${topbar(verb)}
      <section class="pass">
        ${dots(total, done)}
        <p class="muted">Pass the device to</p>
        <div class="who">${esc(name(who))}</div>
        <p class="hint">${hint}</p>
        <button class="btn brass" data-act="iam">I'm ${esc(name(who))}</button>
      </section>
    </div>`;
  }

  const ROLE_ART = { insider: ['🔑', 'Insider', 'You know the truth. Steer the jury to it without looking like you know.'],
    fixer: ['🎭', 'Fixer', 'You know the truth. Get the jury to pick anything else, or to hang.'],
    juror: ['⚖️', 'Juror', 'Find the truth. Somebody at this table is lying.'] };
  function exhibitBlock(p) {
    const c = curCase(), cur = G.cur, ex = E.describeExhibit(c, cur.exhibits[p]);
    if (ex.kind === 'none') return `<div class="secret-ex none">${evCard(c, 'Thrown out on a technicality. You know nothing, so act like you know something.', { label: 'Your exhibit', icon: '🗑️' })}</div>`;
    const stamp = { kind: ex.tag === 'Points to' ? 'points_to' : 'rules_out', v: ex.target };
    return `<div class="secret-ex${ex.kind === 'planted' ? ' planted' : ''}">${evCard(c, ex.text, { label: ex.kind === 'planted' ? 'Your exhibit · planted, and false' : 'Your exhibit · true', stamp })}</div>`;
  }
  function roleCard(p, compact) {
    const c = curCase(), cur = G.cur, role = cur.roles[p];
    const [ic, title, goal] = ROLE_ART[role];
    let goalTxt = goal;
    if (role === 'insider' && E.appealAllowed(G.players.length) && !compact) goalTxt += ' If the verdict is right, the Fixer gets one guess at who you are.';
    if (role === 'juror' && cur.fixers.length > 1) goalTxt = 'Find the truth. Two people at this table are lying.';
    const mates = role === 'fixer' ? cur.fixers.filter(f => f !== p).map(f => name(f) + (isAI(f) ? ' (computer)' : '')) : [];
    const truth = role !== 'juror' ? `<div class="truth-row"><span class="truth-lbl">The truth</span>${suspectCard(c, c.truth, { cls: 'truth' })}<span class="sr">The truth: ${L[c.truth]}. ${esc(c.verdicts[c.truth].label)}</span></div>` : '';
    return `<div class="role-hero r-${role}"><span class="role-ic" aria-hidden="true">${ic}</span><div><div class="role-name role-${role}">${title}</div><p class="role-goal">${esc(goalTxt)}</p></div></div>
      ${truth}
      ${mates.length ? `<p class="mate">Your fellow Fixer: <strong>${esc(mates.join(', '))}</strong></p>` : ''}
      ${exhibitBlock(p)}`;
  }

  function vBrief() {
    const cur = G.cur, p = cur.order[cur.i];
    if (cur.stage === 'pass') return passScreen(p, cur.i, cur.order.length, 'Secret briefing', 'Everyone else, look away. Only ' + esc(name(p)) + ' reads the next screen.');
    if (solo()) {
      return `<div class="bench">
      ${topbar('Your secret')}
      <article class="file secret-card">${roleCard(p)}</article>
      <button class="btn brass block" data-act="brief-done">To the jury room</button>
      <p class="note">This stays on your screen in the jury room, so you can check it any time.</p>
    </div>`;
    }
    return `<div class="bench">
      ${topbar('Secret briefing · ' + name(p))}
      <div class="summons" id="summons" tabindex="0" role="button" aria-label="Press and hold to read your summons">
        <div class="cover"><div class="seal">HJ</div><div class="hold-hint">Press and hold to see your secret</div><p class="muted" style="color:#f0c9b8">Let go and it hides again.</p></div>
        <div class="face" aria-hidden="true">${roleCard(p)}</div>
      </div>
      <button class="btn brass block" data-act="brief-done" ${cur.seen ? '' : 'disabled'}>Done, pass it on</button>
      ${cur.seen ? '' : `<button class="btn wood small" data-act="brief-back">Not ${esc(name(p))}? Go back</button>`}
    </div>`;
  }

  // The tip that appears when the device only has its plain, built-in voices.
  function voiceSteps() {
    const mac = /Macintosh/.test(navigator.userAgent) && !('ontouchend' in document);
    return mac
      ? 'On a Mac: System Settings, then Accessibility, Spoken Content, System voice, Manage Voices. Under English, download a few Enhanced or Premium voices, such as Ava, Zoe, Evan and Nathan. Then reload this page.'
      : 'On iPhone or iPad: Settings, then Accessibility, Spoken Content (called Read & Speak on newer iPhones), Voices, English. Download a few Enhanced voices, such as Ava, Zoe, Evan and Nathan. A mix of men and women gives each juror a different voice. Then reload this page.';
  }
  function voiceTip() {
    if (!window.speechSynthesis || !S().jurorVoices || S().tipHidden) return '';
    const q = Sound.quality();
    if (q === 'great') return '';
    return `<div class="voice-tip" id="voice-tip"><span class="vt-ic" aria-hidden="true">🎙️</span><div><strong>${q === 'none' ? 'This browser has no English voices yet.' : 'Your device is using its plain voices.'}</strong> For natural-sounding jurors: ${esc(voiceSteps())}</div><button class="mini-x" data-act="tip-x" aria-label="Hide this tip">✕</button></div>`;
  }

  // The evidence board: what the room has claimed about each suspect, filled in as people talk.
  function boardHTML() {
    const cur = G.cur, room = cur.room, c = curCase();
    const opts = cur.round === 2 ? cur.options : [0, 1, 2, 3];
    const latest = {}; room.leans.forEach(l => { latest[l.by] = l.v; });
    const face = p => `<span class="mini-av" style="--h:${hue(p)}" title="${esc(name(p))}">${esc(initials(name(p)))}</span>`;
    const uniq = a => a.filter((x, k) => a.indexOf(x) === k);
    const marks = v => {
      const cl = room.claims.filter(x => x.target === v);
      const outs = uniq(cl.filter(x => x.kind === 'rules_out').map(x => x.by)), tos = uniq(cl.filter(x => x.kind === 'points_to').map(x => x.by));
      const fans = Object.keys(latest).map(Number).filter(p => latest[p] === v);
      return `<span class="marks">${outs.length ? `<span class="mk out" title="Says it rules this out">✕ ${outs.map(face).join('')}</span>` : ''}${tos.length ? `<span class="mk to" title="Says it points here">➜ ${tos.map(face).join('')}</span>` : ''}${fans.length ? `<span class="mk lean" title="Leaning this way">👍 ${fans.map(face).join('')}</span>` : ''}${!outs.length && !tos.length && !fans.length ? '<span class="mk none">Nothing yet</span>' : ''}</span>`;
    };
    const outCount = v => uniq(room.claims.filter(x => x.target === v && x.kind === 'rules_out').map(x => x.by)).length;
    const acc = {}; room.accuse.forEach(a => { acc[a.who] = (acc[a.who] || 0) + 1; });
    const accList = Object.keys(acc).map(Number).sort((a, b) => acc[b] - acc[a]).slice(0, 4);
    return `<section class="board-ev" id="board" aria-label="Evidence board">
      <div class="talk-head"><span class="field-label">Evidence board</span><span class="legend">✕ ruled out · ➜ points to · 👍 leaning</span></div>
      ${suspectGrid(c, opts, v => ({ cls: 'mini' + (outCount(v) >= 2 ? ' doubted' : ''), extra: marks(v) }))}
      <p class="board-foot">${accList.length ? `🕵️ Suspected Fixer: ${accList.map(p => `<strong>${esc(name(p))}</strong> ×${acc[p]}`).join(', ')}. ` : ''}Anyone could be lying, including the claims above.</p>
    </section>`;
  }
  function refreshBoard() { const b = document.getElementById('board'); if (b && G.cur.room) b.outerHTML = boardHTML(); }

  function clockBar() {
    const cur = G.cur, left = timeLeft(), running = !!cur.endAt, second = cur.round === 2;
    const fresh = left >= (second ? 90 : G.timer);
    return `<div class="clockbar">
      <div class="clock ${cur.timeUp ? 'done' : left <= 30 ? 'low' : ''}" id="clock"><span class="lbl">${cur.timeUp ? 'Time is up' : running ? 'Arguing' : fresh ? 'Ready' : 'Paused'}</span><span class="time" id="clock-time">${mmss(left)}</span></div>
      <div class="clock-btns">
        ${cur.timeUp ? '' : `<button class="btn ${running ? 'wood' : 'brass'} small" data-act="${running ? 'pause' : 'start'}">${running ? 'Pause' : fresh ? '▶ Start' : '▶ Resume'}</button>`}
        <button class="btn wood small" data-act="add-min">+1 min</button>
        <button class="btn ${cur.timeUp ? 'brass' : 'wood'} small" data-act="vote">${cur.timeUp ? 'To the ballots' : 'Vote now'}</button>
      </div>
    </div>`;
  }

  function vDeliberate() {
    const c = curCase(), cur = G.cur, left = timeLeft(), running = !!cur.endAt;
    const second = cur.round === 2;
    if (cur.room) {
      const me = humanSeats()[0];
      const mine = solo() ? `<details class="mine"${ui.mineOpen === false ? '' : ' open'}><summary>Your secret</summary><div class="file secret-card small">${roleCard(me, true)}</div></details>` : '';
      return `<div class="bench wide">
        ${topbar(second ? 'Second deliberation' : 'Deliberation')}
        ${second ? '<p class="note">Second try: only the suspects still standing are on the ballot.</p>' : ''}
        <div class="delib">
          <div class="side stack">${clockBar()}${voiceTip()}${mine}${boardHTML()}</div>
          <div class="stack">${talkPanel()}${caseFile(c, 'brief')}</div>
        </div>
      </div>`;
    }
    return `<div class="bench wide">
      ${topbar(second ? 'Second deliberation' : 'Deliberation')}
      <div class="delib">
        <div class="side stack">
          <div class="clock ${cur.timeUp ? 'done' : left <= 30 ? 'low' : ''}" id="clock">
            <span class="lbl">${cur.timeUp ? 'Time is up' : running ? 'The jury is out' : left < (second ? 90 : G.timer) ? 'Clock paused' : 'Ready'}</span>
            <span class="time" id="clock-time">${mmss(left)}</span>
          </div>
          <div class="row">
            ${cur.timeUp ? '' : `<button class="btn ${running ? 'wood' : 'brass'}" data-act="${running ? 'pause' : 'start'}">${running ? 'Pause' : left < (second ? 90 : G.timer) ? 'Resume' : 'Start the clock'}</button>`}
            <button class="btn wood" data-act="add-min">+1 minute</button>
          </div>
          <div class="board" role="group" aria-label="Courtroom sound board">
            <button class="btn wood" data-act="sfx" data-v="objection">Objection!</button>
            <button class="btn wood" data-act="sfx" data-v="order">Order!</button>
            <button class="btn wood" data-act="sfx" data-v="sustained">Sustained</button>
            <button class="btn wood" data-act="sfx" data-v="overruled">Overruled</button>
          </div>
          <button class="btn brass block" data-act="vote">${cur.timeUp ? 'To the ballots' : 'Call the vote'}</button>
          <p class="note">${second ? 'Only the suspects still standing are on this ballot.' : 'Argue out loud. Claim your exhibit, or claim something.'}</p>
        </div>
        ${caseFile(c, 'brief')}
      </div>
    </div>`;
  }

  function vBallot() {
    const cur = G.cur, n = G.players.length, p = cur.order[cur.i], c = curCase();
    if (cur.stage === 'pass') return passScreen(p, cur.i, cur.order.length, cur.round === 2 ? 'Second ballot' : 'Secret ballot', 'Vote in secret. Nobody sees your ballot until the verdict is read.');
    const second = cur.round === 2;
    const choices = `<div class="sus-grid">${cur.options.map(i => suspectCard(c, i, { button: true, cls: 'pick', attrs: `data-act="pick-v" data-v="${i}" aria-pressed="${cur.pick.v === i}"` })).join('')}</div>`;
    const others = [...Array(n).keys()].filter(i => i !== p).map(i => `<button class="chip who-chip" data-act="pick-s" data-v="${i}" aria-pressed="${cur.pick.s === i}" style="--h:${hue(i)}"><span class="mini-av">${esc(initials(name(i)))}</span>${esc(name(i))}</button>`).join('');
    const ready = cur.pick.v != null && (second || cur.pick.s != null);
    return `<div class="bench">
      ${topbar((second ? 'Second ballot · ' : 'Secret ballot · ') + name(p))}
      <article class="file ballot stack">
        <h2 style="margin:0">${esc(c.title)}</h2>
        <section><h3 class="sect-h">1. Who did it?</h3>${choices}</section>
        ${second ? '' : `<section><h3 class="sect-h">2. Who is ${cur.fixers.length > 1 ? 'a' : 'the'} Fixer?</h3><div class="chips">${others}</div>
          <p class="small-print" style="margin-top:6px">Name a Fixer correctly and you score a point.</p></section>`}
      </article>
      <button class="btn brass block" data-act="seal" ${ready ? '' : 'disabled'}>Seal my ballot</button>
    </div>`;
  }

  function tallyBoxes(counts, opts) {
    return '<div class="tallies">' + opts.map(i => `<div class="tally ${VC[i]}"><span class="vchip ${VC[i]}">${L[i]}</span><b>${counts[i]}</b></div>`).join('') + '</div>';
  }

  function vHung() {
    const cur = G.cur, c = curCase();
    return `<div class="bench">
      ${topbar('The jury is deadlocked')}
      <section class="courtroom-moment">
        <span class="big-stamp st-hung">Hung jury</span>
        <p class="lead">No verdict won a majority of ${G.players.length} votes.</p>
        ${tallyBoxes(cur.firstCounts, [0, 1, 2, 3])}
        <p class="muted">One more try. Ninety seconds, and only these suspects stay on the ballot:</p>
        <div style="width:100%">${suspectGrid(c, cur.options, { detail: true })}</div>
        <p class="note">Deadlock again and it's a mistrial, which pays the Fixer${cur.fixers.length > 1 ? 's' : ''}.</p>
        <button class="btn brass block" data-act="redeliberate">Back to the jury room</button>
      </section>
    </div>`;
  }

  function vVerdict() {
    const cur = G.cur, c = curCase(), mistrial = cur.verdict == null;
    const counts = E.tally(cur.ballots, cur.options).counts;
    if (!ui.verdictRead) {
      return `<div class="bench">${topbar('The verdict')}
        <section class="courtroom-moment">
          <div class="gavel-wrap">${GAVEL}</div>
          <p class="verdict-line">All rise</p>
          <p class="lead">${esc(name(cur.fore))}, read the verdict.</p>
          <button class="btn brass" data-act="read-verdict">Read the verdict</button>
        </section></div>`;
    }
    const next = !mistrial && cur.verdict === c.truth && E.appealAllowed(G.players.length) ? 'appeal' : 'truth';
    return `<div class="bench">${topbar('The verdict')}
      <section class="courtroom-moment ${reduceMotion ? '' : 'shake'}">
        <div class="gavel-wrap slam">${GAVEL}</div>
        ${mistrial ? `<span class="big-stamp st-hung">Mistrial</span><p class="lead fade-in">Deadlocked twice. The court declares a mistrial.</p>` :
          `<p class="verdict-line">We, the jury, find</p><div class="fade-in verdict-card">${suspectCard(c, cur.verdict, { cls: 'big' })}</div><span class="sr">${L[cur.verdict]}. ${esc(c.verdicts[cur.verdict].label)}</span>`}
        <div class="fade-in">${tallyBoxes(counts, cur.options)}</div>
        <button class="btn brass fade-in" data-act="${next === 'appeal' ? 'to-appeal' : 'to-truth'}">${next === 'appeal' ? 'Hear the appeal' : 'Reveal the truth'}</button>
      </section></div>`;
  }

  function vAppeal() {
    const cur = G.cur, n = G.players.length;
    const fx = cur.fixers.map(name);
    const two = fx.length > 1;
    if (cur.aiAppeal != null) {
      return `<div class="bench">${topbar('Motion to appeal')}
      <section class="panel trim stack center">
        <span class="big-stamp st-over" style="margin:6px auto">Objection!</span>
        <p class="lead">The verdict is right, so the Fixer${two ? 's' : ''} move${two ? '' : 's'} to appeal.</p>
        <p><strong>${esc(fx.join(' and '))}</strong> stand${two ? '' : 's'} up, unmasked.</p>
        <p class="lead">"The Insider was <strong>${esc(name(cur.aiAppeal))}</strong>."</p>
      </section>
      <button class="btn brass block" data-act="file-appeal">Hear the ruling</button>
    </div>`;
    }
    const cands = [...Array(n).keys()].filter(i => !cur.fixers.includes(i)).map(i =>
      `<button class="chip" data-act="pick-appeal" data-v="${i}" aria-pressed="${cur.pick.s === i}">${esc(name(i))}</button>`).join('');
    return `<div class="bench">${topbar('Motion to appeal')}
      <section class="panel trim stack center">
        <span class="big-stamp st-over" style="margin:6px auto">Objection!</span>
        <p class="lead">The verdict is right, so the Fixer${two ? 's' : ''} move${two ? '' : 's'} to appeal.</p>
        <p><strong>${esc(fx.join(' and '))}</strong>, stand up, you've been unmasked. ${two ? 'Confer, then name' : 'Name'} the player you think was the Insider. Get it right and the verdict is overturned.</p>
      </section>
      <article class="file stack"><h3 style="color:var(--ink-soft);font-size:var(--s-1);letter-spacing:.2em">The Insider was</h3><div class="chips">${cands}</div></article>
      <button class="btn brass block" data-act="file-appeal" ${cur.pick.s != null ? '' : 'disabled'}>File the appeal</button>
    </div>`;
  }

  const OUT = {
    correct: ['Justice served', 'st-correct'], wrong: ['Wrong verdict', 'st-wrong'],
    overturned: ['Overturned', 'st-over'], mistrial: ['Mistrial', 'st-hung'],
  };

  function vTruth() {
    const cur = G.cur, c = curCase(), r = cur.result;
    const [label, cls] = OUT[r.outcome];
    let appealLine = '';
    if (cur.appealGuess != null) {
      appealLine = r.outcome === 'overturned'
        ? `<p class="lead">The Fixers named ${esc(name(cur.appealGuess))}, the Insider. Appeal granted.</p>`
        : `<p class="lead">The Fixers named ${esc(name(cur.appealGuess))}. Wrong person. Appeal denied.</p>`;
    }
    return `<div class="bench">${topbar('The truth')}
      <section class="center stack" style="padding-top:8px"><span class="big-stamp ${cls}" style="margin:0 auto">${label}</span>${appealLine}</section>
      <article class="file">
        <div class="court">What really happened</div>
        <div class="verdict-card">${suspectCard(c, c.truth, { cls: 'big' })}</div>
        <p class="story" style="margin-top:12px">${esc(c.ruling)}</p>
      </article>
      <button class="btn brass block" data-act="unmask">Unmask the jury</button>
    </div>`;
  }

  function vUnmask() {
    const cur = G.cur, c = curCase(), r = cur.result, n = G.players.length;
    const final = cur.ballots;
    const rows = [...Array(n).keys()].map(i => {
      const role = cur.roles[i];
      const ex = E.describeExhibit(c, cur.exhibits[i]);
      const exTxt = ex.kind === 'none' ? 'no exhibit' : (ex.kind === 'planted' ? 'planted exhibit, ' : 'exhibit, ') + ex.tag.toLowerCase() + ' ' + L[ex.target];
      const why = r.lines[i].map(l => `+${l.p} ${l.why}`).join(', ');
      return `<div class="roll-row">
        <span class="nm">${nameTag(i)}<span class="badge b-${role}">${role}</span></span>
        <span class="pts">+${r.points[i]}</span>
        <span class="why">Voted ${L[final[i]]}${cur.suspects[i] != null ? ', named ' + esc(name(cur.suspects[i])) : ''} · ${exTxt}${why ? ' · ' + why : ''}</span>
      </div>`;
    }).join('');
    return `<div class="bench">${topbar('Unmasked')}
      <section class="panel trim stack"><h2>Who was who</h2><div class="roll">${rows}</div></section>
      <button class="btn brass block" data-act="standings">See the standings</button>
    </div>`;
  }

  function ranking() {
    return G.players.map((nm, i) => ({ i, nm, tot: G.scores[i] })).sort((a, b) => b.tot - a.tot || a.nm.localeCompare(b.nm));
  }

  function vStandings() {
    const last = G.k + 1 >= G.caseIds.length;
    const delta = G.cur.result ? G.cur.result.points : [];
    let rank = 0, prev = null;
    const rows = ranking().map((p, k) => {
      if (p.tot !== prev) { rank = k + 1; prev = p.tot; }
      return `<div class="stand ${rank === 1 ? 'first' : ''}"><span class="rk">${rank}</span><span class="nm">${nameTag(p.i)}</span><span class="delta">${delta[p.i] ? '+' + delta[p.i] : ''}</span><span class="tot">${p.tot}</span></div>`;
    }).join('');
    const hsNext = humanSeats();
    const nextFore = last || hsNext.length < 2 ? null : name(hsNext[(G.k + 1) % hsNext.length]);
    return `<div class="bench">${topbar('After case ' + (G.k + 1) + ' of ' + G.caseIds.length)}
      <section class="panel trim stack"><h2>Standings</h2><div class="standings">${rows}</div></section>
      ${last ? `<button class="btn brass block" data-act="final">Sentencing</button>` :
        `<button class="btn brass block" data-act="next-case">Next case</button>${nextFore ? `<p class="note">${esc(nextFore)} will be the next Foreperson.</p>` : ''}`}
    </div>`;
  }

  function vFinal() {
    const rk = ranking();
    const top = rk[0].tot;
    const winners = rk.filter(p => p.tot === top).map(p => p.nm);
    const aw = E.awards(G.players, G.stats);
    let rank = 0, prev = null;
    const rows = rk.map((p, k) => {
      if (p.tot !== prev) { rank = k + 1; prev = p.tot; }
      return `<div class="stand ${rank === 1 ? 'first' : ''}"><span class="rk">${rank}</span><span class="nm">${nameTag(p.i)}</span><span class="delta"></span><span class="tot">${p.tot}</span></div>`;
    }).join('');
    return `<div class="bench">${topbar('Sentencing')}
      <section class="courtroom-moment" style="min-height:auto;padding-top:10px">
        <div class="gavel-wrap slam" style="height:150px">${GAVEL}</div>
        <p class="verdict-line">${winners.length > 1 ? 'Co-Chief Justices' : 'Chief Justice'}</p>
        <div class="verdict-big">${esc(winners.join(' & '))}</div>
        <p class="muted">${top} points over ${G.caseIds.length} cases. Court is adjourned.</p>
      </section>
      ${aw.length ? `<section class="awards">${aw.map(a => `<div class="award"><span class="t">${esc(a.title)}</span><span>${esc(a.who.join(', '))}</span><span class="muted" style="font-size:var(--s-1)">${esc(a.why)}</span></div>`).join('')}</section>` : ''}
      <section class="panel trim stack"><h3 style="color:var(--brass-300)">Final standings</h3><div class="standings">${rows}</div></section>
      <div class="row"><button class="btn brass" data-act="rematch">Same jury, new cases</button><button class="btn wood" data-act="adjourn">Adjourn</button></div>
    </div>`;
  }

  // ---------------- Overlays ----------------
  function oRules() {
    return `<div class="overlay" data-act="close-overlay-bg"><article class="file rules" role="dialog" aria-label="How to play">
      <div class="court">The rules of the court</div><h2>How to play Hung Jury</h2>
      <p>Each case has four possible verdicts. Exactly one is true. The table argues it out and votes in secret.</p>
      <h3>Secret roles, dealt fresh every case</h3>
      <ul>
        <li><strong>The Insider</strong> knows the truth and wants the jury to find it, without getting caught knowing.</li>
        <li><strong>The Fixer</strong> also knows the truth and wants any other verdict, or a hung jury. With 7 or more players there are two Fixers, and they know each other.</li>
        <li><strong>Jurors</strong> know only what's in the file, plus a sealed exhibit.</li>
      </ul>
      <h3>Sealed exhibits</h3>
      <p>Most players get one private piece of evidence that rules out a verdict. Jurors' and the Insider's exhibits are true. The Fixer's is planted and false. At a big table some jurors get nothing. You may quote your exhibit, keep it to yourself, or lie about it.</p>
      <h3>A case, start to finish</h3>
      <ul>
        <li>The Foreperson reads the case aloud. That job rotates.</li>
        <li>Pass the device around. Each player presses and holds to read their summons in private.</li>
        <li>Deliberate out loud against the clock.</li>
        <li>Pass the device again for secret ballots: a verdict, and who you think the Fixer is.</li>
        <li>A verdict needs more than half the votes. If nothing gets there, the jury is hung: 90 more seconds and a revote between the leaders. Hung again means a mistrial.</li>
        <li>With 5 or more players, a correct verdict can be appealed: the Fixers unmask and get one guess at the Insider. A correct guess overturns it.</li>
      </ul>
      <h3>Computer jurors</h3>
      <p>Short on people? Add computer jurors in setup, so one person can play alone or two can play with a full table. Each one has a personality, gets a secret role and exhibit like everyone else, and talks in the jury room while the clock runs. Use the buttons there to share your exhibit, claim something else (a bluff), say where you lean, or name a suspect. They react, accuse each other and vote. The computer Fixer lies.</p>
      <h3>Scoring</h3>
      <table class="score-table"><tbody>
        <tr><td>Right verdict stands: each Juror</td><td>+2</td></tr>
        <tr><td>Right verdict stands: the Insider</td><td>+3</td></tr>
        <tr><td>Wrong verdict: each Fixer</td><td>+3</td></tr>
        <tr><td>Appeal wins: each Fixer (Jurors still get +1)</td><td>+3</td></tr>
        <tr><td>Mistrial: each Fixer</td><td>+2</td></tr>
        <tr><td>You named a Fixer on your ballot (not a Fixer yourself)</td><td>+1</td></tr>
        <tr><td>Fixer that nobody named</td><td>+1</td></tr>
      </tbody></table>
      <p class="small-print" style="margin-top:10px">Most points after the last case is Chief Justice. Plays best with 5 to 8. Adults only.</p>
      <p class="small-print">Xbox controller: stick or d-pad moves, A presses (hold A on your summons to read it), B goes back, Start opens the menu.</p>
      <button class="btn brass block" style="margin-top:14px" data-act="close-overlay">Back to court</button>
    </article></div>`;
  }

  function oSettings() {
    const sw = (k, label, hint) => `<div class="toggle"><div><strong>${label}</strong><br><span class="small-print">${hint}</span></div>
      <button class="switch" role="switch" aria-checked="${!!S()[k]}" aria-label="${label}" data-act="toggle" data-k="${k}"></button></div>`;
    return `<div class="overlay" data-act="close-overlay-bg"><article class="file" role="dialog" aria-label="Settings">
      <div class="court">Chambers</div><h2>Settings</h2>
      ${sw('sound', 'Sound', 'Gavel, clock ticks and organ chords.')}
      ${sw('voice', 'Voice lines', 'The bailiff calls out "Objection!" and "Order!" when the device can speak.')}
      ${sw('jurorVoices', 'Computer juror voices', 'Computer jurors read their lines out loud, each in a different voice when the device has several.')}
      ${window.speechSynthesis ? `<p class="small-print" style="margin-top:8px">${Sound.quality() === 'great' ? 'This device has natural voices installed, and the jurors use them.' : esc((Sound.quality() === 'none' ? 'No English voices found yet. ' : 'This device only has its plain voices right now. ') + voiceSteps())}</p>` : ''}
      <p class="small-print" style="margin-top:10px">${DECK.length} cases on the docket. This device remembers the names you enter and which cases you've played, so the next game deals new ones first.</p>
      <button class="btn brass block" style="margin-top:14px" data-act="close-overlay">Done</button>
    </article></div>`;
  }

  function oMenu() {
    return `<div class="overlay" data-act="close-overlay-bg"><article class="file stack" role="dialog" aria-label="Menu">
      <div class="court">Recess</div><h2>Menu</h2>
      <button class="btn wood block" data-act="rules">How to play</button>
      <button class="btn wood block" data-act="settings">Settings</button>
      ${ui.confirmQuit
        ? `<p class="center"><strong>End this trial?</strong> Scores so far will be lost.</p><div class="row"><button class="btn brass" data-act="quit-yes">End the trial</button><button class="btn wood" data-act="quit-no">Keep playing</button></div>`
        : `<button class="btn wood block" data-act="quit">End the trial</button>`}
      <button class="btn brass block" data-act="close-overlay">Back to court</button>
    </article></div>`;
  }

  // ---------------- Render ----------------
  function render() {
    let html;
    if (ui.view === 'home') html = vHome();
    else if (ui.view === 'setup') html = vSetup();
    else {
      const p = G.phase;
      html = p === 'intro' ? vIntro() : p === 'brief' ? vBrief() : p === 'deliberate' ? vDeliberate() : p === 'ballot' ? vBallot()
        : p === 'hung' ? vHung() : p === 'verdict' ? vVerdict() : p === 'appeal' ? vAppeal() : p === 'truth' ? vTruth()
        : p === 'unmask' ? vUnmask() : p === 'standings' ? vStandings() : vFinal();
    }
    if (ui.overlay === 'rules') html += oRules();
    else if (ui.overlay === 'settings') html += oSettings();
    else if (ui.overlay === 'menu') html += oMenu();
    app.innerHTML = html;
    const tl = document.getElementById('talk-lines'); if (tl) tl.scrollTop = tl.scrollHeight;
    const mine = app.querySelector('details.mine'); if (mine) mine.addEventListener('toggle', () => { ui.mineOpen = mine.open; });
    const fold = app.querySelector('.story-fold'); if (fold) { fold.open = !!ui.storyOpen; fold.addEventListener('toggle', () => { ui.storyOpen = fold.open; }); }
    bindSummons();
    if (ui.view === 'game' && G.phase === 'deliberate' && G.cur.endAt) runTicker();
  }
  function go(phase) { G.phase = phase; save(); render(); window.scrollTo(0, 0); }

  function flash(text, green) {
    const d = document.createElement('div');
    d.className = 'flash'; d.innerHTML = `<span class="${green ? 'green' : ''}">${esc(text)}</span>`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 950);
  }

/* Hung Jury controller mapping. Hot-seat game: every pad drives the same controls (pass the pad with the device).
   Stick / d-pad: move the highlight. A: press it; hold A on a sealed summons to read it (let go to hide).
   B: back (closes a window, or Back in setup). Start: menu (or the main button on the home screen). Back (View): How to play.
   A on a name box opens an on-screen keyboard. */
(function () {
  'use strict';
  var app = document.getElementById('app');
  function q(s, root) { return (root || app).querySelector(s); }
  function shown(el) { return !!el && !el.disabled && (!VPad.isVisible || VPad.isVisible(el)); }
  function first(s, root) { var l = (root || app).querySelectorAll(s); for (var i = 0; i < l.length; i++) if (shown(l[i])) return l[i]; return null; }
  function overlay() { return q('.overlay article'); }
  var nav = PadNav.create({
    selector: '[data-act]:not(.overlay), #summons, input, summary',
    scope: function () { return overlay() || app; },
    prefer: function () { var o = overlay(); return o ? first('.btn.brass', o) : (q('#summons') || first('.btn.brass')); },
    hold: '#summons',
    back: function () { var b = first('[data-act="close-overlay"]') || first('[data-act="home"]') || first('[data-act="brief-back"]'); if (b) nav.press(b); },
  });
  VPad.init({
    map: function () {
      if (nav.osk()) return {};
      return {
        Start: { fn: function () {
          var b = overlay() ? first('[data-act="close-overlay"]') : (first('[data-act="menu"]') || first('.btn.brass'));
          if (b) nav.press(b);
        } },
        Back: { fn: function () { if (!overlay()) { var b = first('[data-act="rules"]') || first('[data-act="menu"]'); if (b) nav.press(b); } } },
      };
    },
  });
  window.__padNav = nav;
})();
