<title>Hung Jury</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: one centered "bench" column on walnut paneling under a banker's lamp glow;
   case files are parchment, controls are brass plaques; wider screens split into two columns. */
:root {
  --walnut-950: #140b06;
  --walnut-900: #1f130b;
  --walnut-800: #2c1b10;
  --walnut-700: #3d2616;
  --walnut-500: #6e4628;
  --brass-700: #8a6a2a;
  --brass-500: #c49a45;
  --brass-300: #ecd28b;
  --lamp-green: #1d5b3e;
  --lamp-glow: rgba(255, 214, 140, .20);
  --parchment: #eee0bf;
  --parchment-edge: #d8c398;
  --ink: #2a1b10;
  --ink-soft: #5b4430;
  --oxblood: #8e2b1f;
  --verdigris: #2f6b4f;
  --cream: #f4e8cf;
  --cream-dim: #c9b896;
  --focus: #ffe39a;
  --f-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --f-body: "Libre Caslon Text", "Baskerville", Georgia, serif;
  --f-type: "Courier Prime", "Courier New", ui-monospace, monospace;
  --s-1: .75rem; --s0: .9375rem; --s1: 1.0625rem; --s2: 1.3rem; --s3: 1.7rem; --s4: 2.3rem; --s5: 3.1rem;
  --r: 6px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--walnut-900);
  background-image:
    radial-gradient(ellipse 70% 42% at 50% -6%, var(--lamp-glow), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 120%, rgba(0,0,0,.55), transparent 60%),
    repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 118px, rgba(0,0,0,.35) 118px 121px, rgba(255,220,170,.05) 121px 123px, rgba(0,0,0,0) 123px 240px),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='480'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.42' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.24  0 0 0 0 0.14  0 0 0 0 0.07  0 0 0 0.85 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
  color: var(--cream);
  font-family: var(--f-body);
  font-size: var(--s0);
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app {
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
  display: flex; flex-direction: column; align-items: center;
}
.bench { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 16px; }
.bench.wide { max-width: 1060px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .04em; margin: 0; text-wrap: balance; line-height: 1.15; }
h2 { font-size: var(--s3); }
h3 { font-size: var(--s1); letter-spacing: .08em; text-transform: uppercase; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.crumb { font-family: var(--f-display); font-size: var(--s-1); letter-spacing: .14em; text-transform: uppercase; color: var(--brass-300); }
.icon-btn {
  min-width: 44px; height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid rgba(236,210,139,.35);
  background: rgba(20,11,6,.45); color: var(--brass-300); cursor: pointer; font-family: var(--f-display); font-size: var(--s-1); letter-spacing: .1em;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.icon-btn:hover { background: rgba(60,38,22,.7); }

/* ---------- Brass plaque buttons ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer; border-radius: var(--r);
  min-height: 52px; padding: 12px 22px; font-family: var(--f-display); font-weight: 700; font-size: var(--s1); letter-spacing: .08em;
  text-transform: uppercase; text-align: center; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: transform .08s ease, filter .15s ease;
}
.btn:active { transform: translateY(1px) scale(.99); }
.btn.brass {
  color: #2b1a08;
  background: linear-gradient(180deg, var(--brass-300) 0%, var(--brass-500) 48%, var(--brass-700) 100%);
  box-shadow: inset 0 1px 0 rgba(255,250,220,.75), inset 0 -2px 0 rgba(60,35,10,.45), 0 3px 0 #4a3412, 0 8px 18px rgba(0,0,0,.45);
  text-shadow: 0 1px 0 rgba(255,240,200,.55);
}
.btn.brass:hover { filter: brightness(1.06); }
.btn.wood {
  color: var(--brass-300);
  background: linear-gradient(180deg, var(--walnut-700), var(--walnut-800));
  box-shadow: inset 0 0 0 1px rgba(236,210,139,.45), inset 0 1px 0 rgba(255,220,170,.12), 0 3px 0 var(--walnut-950), 0 6px 14px rgba(0,0,0,.4);
}
.btn.wood:hover { filter: brightness(1.15); }
.btn[disabled] { filter: grayscale(.7) brightness(.7); cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: var(--s-1); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 160px; }

/* ---------- Wood panel ---------- */
.panel {
  position: relative; border-radius: 10px; padding: 18px;
  background: linear-gradient(180deg, rgba(110,70,40,.38), rgba(31,19,11,.6)), var(--walnut-800);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 4px rgba(110,70,40,.55), inset 0 0 0 5px rgba(0,0,0,.5), inset 0 14px 30px rgba(255,210,150,.06), 0 10px 26px rgba(0,0,0,.45);
}
.panel.trim::before {
  content: ""; position: absolute; inset: 8px; border-radius: 6px; pointer-events: none;
  border: 1px solid rgba(236,210,139,.28);
}
.muted { color: var(--cream-dim); }
.lead { font-size: var(--s1); }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 8px; }

/* ---------- Home ---------- */
.marquee { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; }
.lamp { width: min(260px, 64vw); height: auto; display: block; filter: drop-shadow(0 18px 30px rgba(255,210,140,.18)); }
.plaque {
  margin-top: -6px; padding: 14px 26px 12px; border-radius: 8px; text-align: center;
  background: linear-gradient(180deg, var(--brass-300), var(--brass-500) 50%, var(--brass-700));
  box-shadow: inset 0 1px 0 rgba(255,250,220,.8), inset 0 -2px 0 rgba(60,35,10,.5), 0 4px 0 #4a3412, 0 14px 30px rgba(0,0,0,.55);
  position: relative;
}
.plaque::before, .plaque::after { content: ""; position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff2c4, #8a6a2a 70%); box-shadow: 0 1px 1px rgba(0,0,0,.5); }
.plaque::before { left: 9px; } .plaque::after { right: 9px; }
.plaque h1 { font-size: clamp(2.2rem, 9vw, 3.6rem); font-weight: 900; color: #2b1a08; letter-spacing: .12em; text-shadow: 0 1px 0 rgba(255,240,200,.6), 0 -1px 0 rgba(60,35,10,.35); }
.plaque .sub { font-family: var(--f-display); font-size: var(--s-1); letter-spacing: .3em; color: #3d2810; text-transform: uppercase; }
.tagline { font-style: italic; color: var(--cream-dim); text-align: center; max-width: 34ch; margin: 10px auto 0; }

/* ---------- Setup ---------- */
.field-label { font-family: var(--f-display); font-size: var(--s-1); letter-spacing: .16em; text-transform: uppercase; color: var(--brass-300); }
.roster { display: flex; flex-direction: column; gap: 8px; }
.seat { display: grid; grid-template-columns: 28px 1fr auto auto auto; align-items: center; gap: 6px; }
.seat-no { font-family: var(--f-display); color: var(--brass-500); text-align: center; font-size: var(--s-1); }
.seat input {
  min-width: 0; height: 46px; border-radius: 5px; border: 1px solid rgba(236,210,139,.3);
  background: rgba(20,11,6,.55); color: var(--cream); padding: 0 12px; font: inherit; font-size: 16px;
}
.seat input::placeholder { color: rgba(201,184,150,.55); }
.mini { width: 40px; height: 44px; border-radius: 5px; border: 1px solid rgba(236,210,139,.25); background: rgba(20,11,6,.4); color: var(--brass-300); cursor: pointer; font-size: 18px; line-height: 1; }
.mini:hover { background: rgba(60,38,22,.7); }
.mini[disabled] { opacity: .3; cursor: default; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button {
  min-height: 46px; border-radius: 5px; cursor: pointer; border: 1px solid rgba(236,210,139,.3); background: rgba(20,11,6,.45); color: var(--cream);
  font-family: var(--f-body); font-size: var(--s0); padding: 6px 4px;
}
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, var(--brass-300), var(--brass-500)); color: #2b1a08; border-color: transparent; font-weight: 700; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .val { min-width: 3.4ch; text-align: center; font-family: var(--f-display); font-size: var(--s2); color: var(--brass-300); font-variant-numeric: tabular-nums; }
.setup-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 760px) { .setup-grid { grid-template-columns: 1.15fr 1fr; align-items: start; } }
.estimate { font-family: var(--f-type); font-size: var(--s-1); color: var(--cream-dim); }

/* ---------- Parchment case file ---------- */
.file {
  position: relative; color: var(--ink); border-radius: 4px; padding: 22px 20px 20px;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.35), transparent 50%),
    radial-gradient(ellipse at 100% 100%, rgba(150,110,50,.22), transparent 55%),
    var(--parchment);
  box-shadow: inset 0 0 0 1px var(--parchment-edge), inset 0 0 40px rgba(140,100,40,.25), 0 2px 0 rgba(0,0,0,.25), 0 14px 28px rgba(0,0,0,.5);
}
.file::after { /* folder tab */
  content: ""; position: absolute; top: -10px; left: 22px; width: 120px; height: 14px; border-radius: 5px 5px 0 0;
  background: var(--parchment-edge); box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
}
.caption { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--f-type); font-size: var(--s-1); color: var(--ink-soft); letter-spacing: .02em; }
.court { font-family: var(--f-display); font-size: var(--s-1); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); text-align: center; margin-top: 10px; }
.file h2 { color: var(--ink); text-align: center; font-size: clamp(1.35rem, 5vw, 1.9rem); margin: 4px 0 10px; }
.charge { font-style: italic; text-align: center; border-block: 1px solid rgba(90,60,30,.35); padding: 8px 4px; margin-bottom: 12px; }
.story { font-size: var(--s1); line-height: 1.6; }
.readaloud { display: inline-block; font-family: var(--f-type); font-size: var(--s-1); color: var(--oxblood); border: 1px solid var(--oxblood); padding: 1px 6px; border-radius: 3px; letter-spacing: .06em; }
.stamp {
  position: absolute; right: 14px; top: 34px; transform: rotate(8deg); font-family: var(--f-display); font-weight: 900; letter-spacing: .14em;
  color: rgba(142,43,31,.78); border: 3px double rgba(142,43,31,.7); padding: 2px 8px; border-radius: 4px; font-size: .72rem; text-transform: uppercase; pointer-events: none;
  mix-blend-mode: multiply;
}
.sect { margin-top: 16px; }
.sect h3 { color: var(--ink-soft); font-size: var(--s-1); letter-spacing: .2em; margin-bottom: 8px; }
.verdicts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.verdicts li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.vletter {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700;
  color: var(--parchment); background: radial-gradient(circle at 35% 30%, #5b3a22, #2a1b10); box-shadow: inset 0 0 0 2px rgba(196,154,69,.6);
}
.vlabel { font-weight: 700; }
.vdetail { color: var(--ink-soft); font-size: var(--s-1); }
.exhibits { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.exhibits li { font-family: var(--f-type); font-size: var(--s0); line-height: 1.45; background: rgba(255,255,255,.28); border-left: 3px solid rgba(90,60,30,.4); padding: 8px 10px; border-radius: 2px; }
details.story-fold summary { cursor: pointer; font-family: var(--f-display); letter-spacing: .14em; font-size: var(--s-1); text-transform: uppercase; color: var(--ink-soft); padding: 4px 0; }
details.story-fold[open] summary { margin-bottom: 6px; }

/* ---------- Pass screen ---------- */
.pass { min-height: 62vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.pass .who { font-family: var(--f-display); font-weight: 900; font-size: clamp(2.2rem, 11vw, 4rem); color: var(--brass-300); letter-spacing: .06em; text-shadow: 0 2px 0 #000; overflow-wrap: anywhere; }
.pass .hint { color: var(--cream-dim); max-width: 32ch; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots span { width: 10px; height: 10px; border-radius: 50%; background: rgba(236,210,139,.2); box-shadow: inset 0 0 0 1px rgba(236,210,139,.4); }
.dots span.on { background: var(--brass-500); }

/* ---------- Secret summons (hold to reveal) ---------- */
.summons { position: relative; border-radius: 10px; min-height: clamp(440px, 64vh, 620px); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
.summons .cover, .summons .face { position: absolute; inset: 0; border-radius: 10px; padding: 22px 20px; transition: opacity .12s ease; }
.summons .cover {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
  background: linear-gradient(180deg, #7a1f17, #4e120c); box-shadow: inset 0 0 0 2px rgba(236,210,139,.5), inset 0 0 0 7px rgba(0,0,0,.25), 0 12px 26px rgba(0,0,0,.5);
}
.seal { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 1.5rem; color: #3a0d08;
  background: radial-gradient(circle at 38% 32%, #d65a46, #8e2b1f 62%, #5c140d); box-shadow: 0 3px 0 rgba(0,0,0,.35), inset 0 0 0 6px rgba(0,0,0,.12); }
.summons .face { opacity: 0; overflow: auto; color: var(--ink); background: var(--parchment); box-shadow: inset 0 0 0 1px var(--parchment-edge), inset 0 0 40px rgba(140,100,40,.25); }
.summons.open .face { opacity: 1; }
.summons.open .cover { opacity: 0; }
.role-name { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.9rem, 8vw, 2.6rem); letter-spacing: .1em; text-align: center; }
.role-insider { color: var(--verdigris); }
.role-fixer { color: var(--oxblood); }
.role-juror { color: var(--ink); }
.brief-lines { display: grid; gap: 10px; margin-top: 10px; font-size: var(--s0); }
.truthbox { border: 2px solid currentColor; border-radius: 6px; padding: 8px 10px; font-weight: 700; text-align: center; }
.exhibit-card { font-family: var(--f-type); background: rgba(255,255,255,.4); border: 1px dashed rgba(90,60,30,.55); border-radius: 4px; padding: 10px; }
.exhibit-card .tag { display: inline-block; margin-top: 6px; font-weight: 700; color: var(--oxblood); }
.planted-note { font-family: var(--f-body); font-style: italic; color: var(--oxblood); font-size: var(--s-1); }
.hold-hint { font-family: var(--f-display); letter-spacing: .14em; text-transform: uppercase; font-size: var(--s-1); color: var(--brass-300); }

/* ---------- Deliberation ---------- */
.delib { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .delib { grid-template-columns: 340px 1fr; align-items: start; } .delib .side { position: sticky; top: 12px; } }
.clock {
  display: grid; place-items: center; gap: 2px; padding: 16px; border-radius: 12px; text-align: center;
  background: radial-gradient(circle at 50% 35%, #f6ecd2, #d9c69a 70%, #b59a5e); color: var(--ink);
  box-shadow: inset 0 0 0 4px var(--brass-500), inset 0 0 0 7px var(--brass-700), inset 0 0 20px rgba(80,50,10,.4), 0 10px 22px rgba(0,0,0,.5);
}
.clock .time { font-family: var(--f-display); font-weight: 900; font-size: clamp(3rem, 15vw, 4.6rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.clock .lbl { font-family: var(--f-display); font-size: var(--s-1); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
.clock.low .time { color: var(--oxblood); }
.clock.done .time { color: var(--oxblood); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.board { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.board .btn { min-height: 48px; font-size: var(--s-1); padding: 8px 6px; }

/* ---------- Ballot ---------- */
.ballot { color: var(--ink); }
.choice-list { display: grid; gap: 8px; }
.choice {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; cursor: pointer; min-height: 56px;
  padding: 10px 12px; border-radius: 6px; border: 1px solid rgba(90,60,30,.35); background: rgba(255,255,255,.3); color: var(--ink); font: inherit;
}
.choice[aria-pressed="true"] { background: #2a1b10; color: var(--parchment); border-color: #2a1b10; }
.choice[aria-pressed="true"] .vletter { background: radial-gradient(circle at 35% 30%, var(--brass-300), var(--brass-700)); color: #2b1a08; }
.choice[aria-pressed="true"] .vdetail { color: var(--cream-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 46px; padding: 8px 14px; border-radius: 23px; cursor: pointer; border: 1px solid rgba(90,60,30,.45); background: rgba(255,255,255,.3); color: var(--ink); font: inherit; }
.chip[aria-pressed="true"] { background: var(--oxblood); color: #fff3e6; border-color: var(--oxblood); }

/* ---------- Verdict & gavel ---------- */
.courtroom-moment { min-height: 64vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; position: relative; }
.gavel-wrap { position: relative; width: min(300px, 78vw); height: 200px; }
.gavel-wrap svg { width: 100%; height: 100%; overflow: visible; }
.gavel { transform-origin: 82% 78%; transform: rotate(-38deg); }
.slam .gavel { animation: slam .5s cubic-bezier(.6,0,.9,.4) forwards; }
@keyframes slam { 0% { transform: rotate(-38deg); } 70% { transform: rotate(4deg); } 82% { transform: rotate(-3deg); } 100% { transform: rotate(0deg); } }
.shake { animation: shake .35s ease .34s; }
@keyframes shake { 20% { transform: translate(-5px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, 0); } }
.verdict-line { font-family: var(--f-display); font-size: var(--s1); letter-spacing: .14em; text-transform: uppercase; color: var(--cream-dim); }
.verdict-big { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.8rem, 8vw, 3rem); color: var(--brass-300); text-shadow: 0 2px 0 #000; max-width: 18ch; }
.fade-in { animation: fadeIn .5s ease .55s both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.big-stamp {
  display: inline-block; font-family: var(--f-display); font-weight: 900; font-size: clamp(1.6rem, 8vw, 2.6rem); letter-spacing: .14em; text-transform: uppercase;
  padding: 4px 16px; border: 5px double currentColor; border-radius: 6px; transform: rotate(-6deg);
  animation: stampIn .35s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stampIn { from { transform: rotate(-6deg) scale(2.2); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
.st-correct { color: #8fd3a8; } .st-wrong { color: #ff8f7a; } .st-hung { color: var(--brass-300); } .st-over { color: #ffb36b; }
.tallies { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tally { min-width: 64px; padding: 6px 10px; border-radius: 6px; background: rgba(20,11,6,.55); box-shadow: inset 0 0 0 1px rgba(236,210,139,.3); font-family: var(--f-display); }
.tally b { display: block; font-size: var(--s2); color: var(--brass-300); font-variant-numeric: tabular-nums; }

/* ---------- Unmasking / scores ---------- */
.roll { display: grid; gap: 8px; }
.roll-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: 6px; background: rgba(20,11,6,.45); box-shadow: inset 0 0 0 1px rgba(236,210,139,.18); }
.roll-row .nm { font-weight: 700; font-size: var(--s1); overflow-wrap: anywhere; }
.roll-row .pts { font-family: var(--f-display); font-weight: 900; font-size: var(--s2); color: var(--brass-300); font-variant-numeric: tabular-nums; text-align: right; }
.roll-row .why { grid-column: 1 / -1; color: var(--cream-dim); font-size: var(--s-1); }
.badge { display: inline-block; font-family: var(--f-display); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; }
.b-insider { background: var(--verdigris); color: #eafff2; } .b-fixer { background: var(--oxblood); color: #fff1ea; } .b-juror { background: rgba(236,210,139,.2); color: var(--brass-300); }
.standings { display: grid; gap: 6px; counter-reset: rank; }
.stand { display: grid; grid-template-columns: 36px 1fr auto auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; background: rgba(20,11,6,.45); }
.stand .rk { font-family: var(--f-display); color: var(--brass-500); text-align: center; }
.stand .tot { font-family: var(--f-display); font-weight: 900; font-size: var(--s2); color: var(--brass-300); font-variant-numeric: tabular-nums; }
.stand .delta { font-family: var(--f-type); color: #9fd8b2; min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
.stand.first { background: linear-gradient(90deg, rgba(196,154,69,.35), rgba(20,11,6,.45)); }
.award { display: grid; gap: 2px; padding: 12px; border-radius: 6px; background: rgba(20,11,6,.45); box-shadow: inset 0 0 0 1px rgba(236,210,139,.25); }
.award .t { font-family: var(--f-display); font-weight: 700; color: var(--brass-300); letter-spacing: .06em; }
.awards { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10,5,2,.78); display: flex; align-items: flex-start; justify-content: center; overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay .file { max-width: 680px; width: 100%; margin-block: 16px; }
.rules h3 { color: var(--ink-soft); margin-top: 14px; margin-bottom: 4px; letter-spacing: .14em; }
.rules ul { margin: 4px 0; padding-left: 20px; }
.rules li { margin: 3px 0; }
.score-table { width: 100%; border-collapse: collapse; font-size: var(--s-1); }
.score-table td { padding: 5px 4px; border-bottom: 1px solid rgba(90,60,30,.25); vertical-align: top; }
.score-table td:last-child { text-align: right; font-weight: 700; white-space: nowrap; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(90,60,30,.25); }
.switch { width: 56px; height: 32px; border-radius: 16px; border: 0; cursor: pointer; background: #9b8a6a; position: relative; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff7e6; transition: left .15s ease; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.switch[aria-checked="true"] { background: var(--verdigris); }
.switch[aria-checked="true"]::after { left: 27px; }
.flash { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; pointer-events: none; }
.flash span { font-family: var(--f-display); font-weight: 900; font-size: clamp(2.6rem, 14vw, 6rem); letter-spacing: .08em; color: var(--oxblood); background: rgba(238,224,191,.92);
  border: 6px double var(--oxblood); padding: 6px 22px; border-radius: 8px; transform: rotate(-8deg); animation: flashStamp .9s ease both; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.flash span.green { color: var(--verdigris); border-color: var(--verdigris); }
@keyframes flashStamp { 0% { transform: rotate(-8deg) scale(2); opacity: 0; } 18% { transform: rotate(-8deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.privacy-veil { position: fixed; inset: 0; z-index: 70; background: var(--walnut-950); display: grid; place-items: center; color: var(--brass-300); font-family: var(--f-display); letter-spacing: .14em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.note { font-size: var(--s-1); color: var(--cream-dim); text-align: center; }
.small-print { font-size: var(--s-1); color: var(--ink-soft); }

/* ---------- Computer jurors: the jury-room transcript and what you can say ---------- */
.talk { background: rgba(20,11,6,.55); border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(236,210,139,.22); display: flex; flex-direction: column; }
.talk-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 14px 6px; border-bottom: 1px solid rgba(236,210,139,.14); }
.talk-head .field-label { margin: 0; }
.talk-lines { height: clamp(220px, 40vh, 440px); overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; overscroll-behavior: contain; scroll-behavior: smooth; }
.line { display: flex; align-items: flex-end; gap: 8px; margin: 0; max-width: 92%; }
.line.me { flex-direction: row-reverse; align-self: flex-end; }
.line .av, .seat-av .av { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: .78rem;
  color: #fff7e6; background: hsl(var(--h) 45% 32%); box-shadow: inset 0 0 0 2px hsl(var(--h) 55% 58%), 0 2px 4px rgba(0,0,0,.4); }
.bub { position: relative; background: var(--parchment); color: var(--ink); border-radius: 16px 16px 16px 4px; padding: 8px 12px 9px; line-height: 1.42; overflow-wrap: anywhere;
  box-shadow: 0 2px 0 rgba(0,0,0,.25), inset 0 0 0 1px rgba(90,60,30,.25); }
.bub::before { content: ""; position: absolute; left: -7px; bottom: 6px; border: 7px solid transparent; border-right-color: var(--parchment); border-left: 0; }
.line.me .bub { background: #cfe8d6; border-radius: 16px 16px 4px 16px; }
.line.me .bub::before { left: auto; right: -7px; border-right: 0; border-left: 7px solid #cfe8d6; }
.bub .who-n { display: block; font-family: var(--f-display); font-weight: 700; font-size: var(--s-1); letter-spacing: .04em; color: hsl(var(--h, 30) 45% 28%); margin-bottom: 1px; }
.line.me .bub .who-n { color: #1f5a3c; }
.bub .ai-tag { color: var(--ink-soft); box-shadow: inset 0 0 0 1px rgba(90,60,30,.4); }
.line.ai.k-accuse .bub, .line.ai.k-object .bub, .line.ai.k-pile .bub { background: #f6d4c6; }
.line.ai.k-accuse .bub::before, .line.ai.k-object .bub::before, .line.ai.k-pile .bub::before { border-right-color: #f6d4c6; }
.line.k-claim .txt { font-family: var(--f-type); font-size: .92em; }
.line.pop { animation: bubblePop .38s cubic-bezier(.2, 1.5, .4, 1) both; transform-origin: left bottom; }
.line.me.pop { transform-origin: right bottom; }
.line.sys { display: block; align-self: center; color: var(--cream-dim); font-style: italic; text-align: center; font-size: var(--s-1); max-width: 100%; }
.jbox { display: flex; gap: 10px; overflow-x: auto; padding: 10px 14px 4px; scrollbar-width: none; }
.seat-av { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 46px; transition: transform .2s ease; }
.seat-av .nm { font-size: .68rem; color: var(--cream-dim); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-av.talking { transform: translateY(-3px) scale(1.12); }
.seat-av.talking .av { box-shadow: 0 0 0 3px var(--brass-300), 0 0 14px rgba(236,210,139,.7); }
.seat-av.talking .nm { color: var(--brass-300); }
@keyframes bubblePop { 0% { opacity: 0; transform: scale(.55); } 100% { opacity: 1; transform: scale(1); } }
.talk-empty { margin: auto; color: var(--cream-dim); text-align: center; font-size: var(--s-1); max-width: 30ch; }
.ai-tag { display: inline-block; font-family: var(--f-type); font-size: .62rem; letter-spacing: .08em; padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: 2px;
  color: var(--brass-300); box-shadow: inset 0 0 0 1px rgba(236,210,139,.4); font-weight: 400; text-transform: uppercase; }
.say { padding: 10px 14px 14px; border-top: 1px solid rgba(236,210,139,.14); display: grid; gap: 10px; }
.say-row { display: flex; flex-wrap: wrap; gap: 8px; }
.say-row .btn { flex: 1 1 130px; }
.pill { min-height: 44px; padding: 6px 14px; border-radius: 22px; cursor: pointer; font: inherit; color: var(--cream); background: rgba(60,38,22,.65); border: 1px solid rgba(236,210,139,.3); }
.pill:hover { background: rgba(90,58,32,.8); }
.pill[aria-pressed="true"] { background: linear-gradient(180deg, var(--brass-300), var(--brass-500)); color: #2b1a08; border-color: transparent; font-weight: 700; }
.pill[disabled] { opacity: .4; cursor: default; }
.say-sub { display: grid; gap: 8px; padding: 10px; border-radius: 6px; background: rgba(0,0,0,.25); }
.say-sub .muted { font-size: var(--s-1); }
.bots-line { font-size: var(--s-1); color: var(--cream-dim); }

/* ---------- Redesign: color-coded suspects, evidence cards, the evidence board ---------- */
.va { --vc: #b8452f; --vc-soft: #f7ddd3; } .vb { --vc: #2f6f9f; --vc-soft: #d8e7f3; }
.vc { --vc: #3f8a4f; --vc-soft: #dcefdc; } .vd { --vc: #a8781f; --vc-soft: #f5e8c8; }
.vchip { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; font-family: var(--f-display); font-weight: 900; font-size: .85em; color: #fff; background: var(--vc); vertical-align: middle; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.steps { list-style: none; margin: -6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; counter-reset: st; }
.steps li { counter-increment: st; text-align: center; font-family: var(--f-display); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--cream-dim); padding-top: 8px; border-top: 4px solid rgba(236,210,139,.18); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps li.done { border-top-color: var(--brass-700); color: var(--brass-500); }
.steps li.now { border-top-color: var(--brass-300); color: var(--brass-300); font-weight: 700; }
.file .caption { justify-content: space-between; }
.charge { font-style: normal; font-weight: 700; font-size: var(--s1); display: flex; gap: 8px; align-items: flex-start; text-align: left; background: rgba(255,255,255,.35); border: 0; border-left: 4px solid var(--oxblood); border-radius: 4px; padding: 10px 12px; }
.q-ic { flex: 0 0 auto; }

<script>/* Hung Jury engine: roles, sealed exhibits, ballots and scoring.
   Pure logic, no DOM. Runs in the browser and in Node (for tests). */
(function (root) {
  'use strict';

  const MIN_PLAYERS = 3, MAX_PLAYERS = 10;

  // Seeded random so a game can be replayed in tests; the browser seeds from the clock.
  function makeRng(seed) {
    let s = (seed >>> 0) || 0x9e3779b9;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function roleCounts(n) {
    const fixers = n >= 7 ? 2 : 1;
    return { insider: 1, fixers, jurors: n - 1 - fixers };
  }
  const appealAllowed = n => n >= 5;

  // Deliberation time in seconds: grows with the table, rounded to 15 s.
  function deliberationSeconds(n) {
    const s = 120 + 25 * n;
    return Math.max(180, Math.min(390, Math.round(s / 15) * 15));
  }
  // Rough minutes for a whole game, used on the setup screen.
  function estimateMinutes(n, cases) {
    const perCase = 2 + 0.25 * n + deliberationSeconds(n) / 60 + 0.2 * n + 2;
    return Math.round(perCase * cases);
  }
  // Number of cases that lands a game near 40 minutes.
  function defaultCases(n) {
    let best = 3, bestDiff = Infinity;
    for (let c = 2; c <= 6; c++) {
      const d = Math.abs(estimateMinutes(n, c) - 40);
      if (d < bestDiff) { best = c; bestDiff = d; }
    }
    return best;
  }

  // Choose the special roles, favoring players who have had fewer of them.
  // history: array (per player) of { insider: k, fixer: k }.
  function dealRoles(n, history, rng) {
    const counts = roleCounts(n);
    const hist = i => (history && history[i]) || { insider: 0, fixer: 0 };
    const pickBy = (pool, weight) => {
      const ws = pool.map(weight);
      const total = ws.reduce((a, b) => a + b, 0);
      let r = rng() * total;
      for (let k = 0; k < pool.length; k++) { r -= ws[k]; if (r <= 0) return pool[k]; }
      return pool[pool.length - 1];
    };
    let pool = [...Array(n).keys()];
    const insider = pickBy(pool, i => 1 / Math.pow(1 + hist(i).insider + 0.5 * hist(i).fixer, 2));
    pool = pool.filter(i => i !== insider);
    const fixers = [];
    for (let f = 0; f < counts.fixers; f++) {
      const p = pickBy(pool, i => 1 / Math.pow(1 + hist(i).fixer + 0.5 * hist(i).insider, 2));
      fixers.push(p);
      pool = pool.filter(i => i !== p);
    }
    const roles = [];
    for (let i = 0; i < n; i++) roles.push(i === insider ? 'insider' : fixers.includes(i) ? 'fixer' : 'juror');
    return { roles, insider, fixers };
  }

  // Hand out exhibits. Each true sealed exhibit goes to at most two players
  // (the Insider takes one first), so a big table has a few "inadmissible" jurors.
  function dealExhibits(c, deal, rng) {
    const n = deal.roles.length;
    const sealed = shuffle(c.sealed.map((s, k) => k), rng);
    const holders = sealed.map(() => 0);
    const out = new Array(n).fill(null);
    // Insider
    out[deal.insider] = { kind: 'true', idx: sealed[0] };
    holders[0] = 1;
    // Fixers: one planted each (two Fixers get different ones)
    const planted = shuffle([0, 1], rng);
    deal.fixers.forEach((p, k) => { out[p] = { kind: 'planted', idx: planted[k % 2] }; });
    // Jurors, in random order: fill each true exhibit once, then a second copy, then nothing.
    const jurors = shuffle([...Array(n).keys()].filter(i => deal.roles[i] === 'juror'), rng);
    let k = 1;
    for (const j of jurors) {
      let placed = false;
      for (let tries = 0; tries < sealed.length * 2 && !placed; tries++) {
        const slot = k % sealed.length; k++;
        if (holders[slot] < 2) { holders[slot]++; out[j] = { kind: 'true', idx: sealed[slot] }; placed = true; }
      }
      if (!placed) out[j] = { kind: 'none' };
    }
    return out;
  }

  // What a player's exhibit says, ready to show.
  function describeExhibit(c, ex) {
    if (!ex || ex.kind === 'none') return { kind: 'none' };
    if (ex.kind === 'true') {
      const s = c.sealed[ex.idx];
      return { kind: 'true', text: s.text, tag: 'Rules out', target: s.rules_out };
    }
    const p = c.planted[ex.idx];
    if (typeof p.rules_out === 'number') return { kind: 'planted', text: p.text, tag: 'Rules out', target: p.rules_out };
    return { kind: 'planted', text: p.text, tag: 'Points to', target: p.points_to };
  }

  // ballots: array of verdict indexes (one per player). options: allowed verdict indexes.
  function tally(ballots, options) {
    const counts = [0, 0, 0, 0];
    ballots.forEach(v => { if (v != null && v >= 0 && v < 4) counts[v]++; });
    const n = ballots.length;
    let winner = null;
    for (const o of options) if (counts[o] * 2 > n) winner = o;
    // Revote options: every verdict tied with first or second place.
    const ranked = options.slice().sort((a, b) => counts[b] - counts[a]);
    const second = counts[ranked[Math.min(1, ranked.length - 1)]];
    let top = ranked.filter(o => counts[o] >= second && counts[o] > 0);
    if (top.length < 2) top = ranked.slice(0, 2);
    top.sort((a, b) => a - b);
    return { counts, winner, top };
  }

  /* Score one case.
     r = { roles, truth, verdict (index or null for a mistrial), appealGuess (player index or null),
           suspects (array: who each player named as the Fixer) }
     Returns { points: [per player], outcome, lines: [per player: array of reasons], namedCount }. */
  function scoreCase(r) {
    const n = r.roles.length;
    const points = new Array(n).fill(0);
    const lines = [...Array(n)].map(() => []);
    const insider = r.roles.indexOf('insider');
    const fixers = r.roles.map((x, i) => x === 'fixer' ? i : -1).filter(i => i >= 0);
    let outcome;
    if (r.verdict == null) outcome = 'mistrial';
    else if (r.verdict !== r.truth) outcome = 'wrong';
    else if (r.appealGuess != null && r.appealGuess === insider) outcome = 'overturned';
    else outcome = 'correct';

    const add = (i, p, why) => { points[i] += p; lines[i].push({ p, why }); };
    for (let i = 0; i < n; i++) {
      const role = r.roles[i];
      if (outcome === 'correct') {
        if (role === 'juror') add(i, 2, 'Right verdict');
        if (role === 'insider') add(i, 3, 'Truth prevailed');
      } else if (outcome === 'overturned') {
        if (role === 'fixer') add(i, 3, 'Won the appeal');
        if (role === 'juror') add(i, 1, 'Right verdict, overturned');
      } else if (outcome === 'wrong') {
        if (role === 'fixer') add(i, 3, 'Wrong verdict');
      } else {
        if (role === 'fixer') add(i, 2, 'Hung jury');
      }
    }
    // Accusations
    const namedCount = new Array(n).fill(0);
    (r.suspects || []).forEach((s, i) => {
      if (s == null || r.roles[i] === 'fixer') return;
      namedCount[s]++;
      if (r.roles[s] === 'fixer') add(i, 1, 'Spotted the Fixer');
    });
    fixers.forEach(f => { if (namedCount[f] === 0) add(f, 1, 'Clean getaway'); });
    return { points, outcome, lines, namedCount };
  }

  // Pick cases for a game: honor the tone filter, prefer ones this device hasn't played,
  // and alternate silly and serious in a mixed game.
  function pickCases(deck, count, tone, used, rng) {
    const usedSet = new Set(used || []);
    const ordered = list => shuffle(list.filter(c => !usedSet.has(c.id)), rng).concat(shuffle(list.filter(c => usedSet.has(c.id)), rng));
    if (tone !== 'mix') {
      let pool = deck.filter(c => c.tone === tone);
      if (!pool.length) pool = deck.slice();
      return ordered(pool).slice(0, count);
    }
    const abs = ordered(deck.filter(c => c.tone === 'absurd'));
    const ser = ordered(deck.filter(c => c.tone === 'serious'));
    const lanes = rng() < 0.5 ? [abs, ser] : [ser, abs];
    const picked = [];
    for (let k = 0; picked.length < count && (abs.length || ser.length); k++) {
      const lane = lanes[k % 2].length ? lanes[k % 2] : lanes[(k + 1) % 2];
      picked.push(lane.shift());
    }
    return picked;
  }

  // Awards for the end of the night. stats: per player { points, insiderWins, fixerWins, spotted, rightVotes, wrongVotes, roles }
  function awards(names, stats) {
    const out = [];
    const best = (key, minVal) => {
      const top = Math.max(...stats.map(s => s[key]));
      if (top < (minVal || 1)) return [];
      return stats.map((s, i) => s[key] === top ? i : -1).filter(i => i >= 0);
    };
    const add = (title, why, who) => { if (who.length && who.length <= 3) out.push({ title, why, who: who.map(i => names[i]) }); };
    add('Silver Tongue', 'Most wins as the Fixer', best('fixerWins'));
    add('Most Trustworthy Face', 'Most wins as the Insider', best('insiderWins'));
    add('Bloodhound', 'Spotted the Fixer most often', best('spotted'));
    add('Easily Swayed', 'Most votes for the wrong verdict', best('wrongVotes', 2));
    return out;
  }

  // Basic shape check for a case; returns a list of problems (empty when fine).
  function validateCase(c) {
    const errs = [];
    const need = (cond, msg) => { if (!cond) errs.push(c.id + ': ' + msg); };
    need(typeof c.id === 'string' && c.id, 'id');
    need(c.tone === 'absurd' || c.tone === 'serious', 'tone');
    need(Array.isArray(c.verdicts) && c.verdicts.length === 4, '4 verdicts');
    need(Number.isInteger(c.truth) && c.truth >= 0 && c.truth < 4, 'truth index');
    need(Array.isArray(c.public) && c.public.length === 3, '3 public exhibits');
    need(Array.isArray(c.sealed) && c.sealed.length === 3, '3 sealed exhibits');
    if (Array.isArray(c.sealed)) {
      const outs = c.sealed.map(s => s.rules_out).sort();
      const want = [0, 1, 2, 3].filter(i => i !== c.truth);
      need(JSON.stringify(outs) === JSON.stringify(want), 'sealed exhibits must rule out each wrong verdict once');
    }
    need(Array.isArray(c.planted) && c.planted.length === 2, '2 planted exhibits');
    if (Array.isArray(c.planted) && c.planted.length === 2) {
      need(c.planted[0].rules_out === c.truth, 'first planted exhibit must rule out the truth');
      need(Number.isInteger(c.planted[1].points_to) && c.planted[1].points_to !== c.truth, 'second planted exhibit must point to a wrong verdict');
    }
    need(typeof c.ruling === 'string' && c.ruling.length > 20, 'ruling');
    return errs;
  }

  const api = { MIN_PLAYERS, MAX_PLAYERS, makeRng, shuffle, roleCounts, appealAllowed, deliberationSeconds,
    estimateMinutes, defaultCases, dealRoles, dealExhibits, describeExhibit, tally, scoreCase, pickCases, awards, validateCase };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.JuryEngine = api;
})(typeof self !== 'undefined' ? self : this);
</script>
<script>window.JURY_CASES=[{"id":"purloined-pad-thai","tone":"absurd","title":"The Case of the Purloined Pad Thai","charge":"Who has been eating Gary Pell's labeled lunch out of the break-room fridge every week?","story":"For six straight weeks, someone has eaten Gary Pell's lunch from the third-floor fridge, despite a label reading GARY'S. DO NOT. I MEAN IT. Gary has filed four complaints, and the office now buys him a sympathy pizza every Friday. The suspects: Marco, the permanently hungry intern; Denise from HR, who purges the fridge on a schedule only she understands; regional manager Bev Stroud, who 'just grabs whatever'; and, quietly, Gary himself.","verdicts":[{"label":"Marco the intern","detail":"Broke, 22, and visibly hungry from 10 a.m. onward."},{"label":"Denise from HR","detail":"Throws out 'unclaimed' food and may have a very loose definition of it."},{"label":"Gary himself","detail":"Eats his own lunch early, then plays the victim for pizza."},{"label":"Bev the regional manager","detail":"Believes everything in the building technically belongs to her."}],"truth":2,"public":["Exhibit A: The empty containers are always found rinsed and stacked in the dish rack. Whoever does this was raised right.","Exhibit B: In Week 3, Marco was seen eating a suspiciously homemade-looking meatloaf sandwich.","Exhibit C: Gary's wife packs his lunch every morning. Last month she put him on a strict 1,400-calorie plan."],"sealed":[{"rules_out":0,"text":"Badge log: on four of the six theft days, Marco was doing inventory at the off-site warehouse, 40 miles away, from 9 a.m. to 5 p.m."},{"rules_out":1,"text":"HR calendar: Denise was on vacation for all of Weeks 4 and 5. Gary's lunch vanished both weeks anyway."},{"rules_out":3,"text":"Room booking log: on every theft day, Bev was locked in the quarterly budget review from 11 a.m. to 2 p.m., with lunch catered in."}],"planted":[{"rules_out":2,"text":"Fridge cam still, Week 6, 11:47 a.m.: the fridge door is open while Gary sits at his desk on a call. IT verified the timestamp."},{"points_to":0,"text":"Text from Marco to a friend, Week 2: 'free lunch again lol. accounting guy cooks better than my mom.'"}],"ruling":"Gary ate his own lunch at 10:15 every morning, rinsed the container like a gentleman, and reported it stolen by noon. Starving on his wife's diet plan, he'd discovered that victims get free pizza. The only thing stolen here was the pizza fund."},{"id":"missing-lemon-tier","tone":"absurd","title":"The Case of the Missing Lemon Tier","charge":"Who removed the top tier of Tessa and Jake's wedding cake an hour before the reception?","story":"At 4 p.m., an hour before the reception at the Hollister family barn, the coordinator found the five-tier wedding cake down to four. The top tier, lemon-poppyseed, requested by the groom's mother, was simply gone. The cake table sat unguarded during the groom's-side photos. The suspects: Lorraine, the bride's mother, who calls lemon cake 'a cry for help'; Duncan, the best man, nursing a heroic hangover; Biscuit, the couple's food-obsessed Labrador; and Aunt Philippa, a home baker still stung that she wasn't hired.","verdicts":[{"label":"Lorraine, the bride's mother","detail":"Despised the lemon tier and wanted her own chocolate fudge up top."},{"label":"Duncan, the best man","detail":"Hungover, unsupervised, and powerfully drawn to sugar."},{"label":"Biscuit, the Labrador","detail":"Tall enough on hind legs, and has eaten a whole ham before."},{"label":"Aunt Philippa","detail":"Wanted the cake to fail so everyone would wish they'd hired her."}],"truth":0,"public":["Exhibit A: The cake topper, two tiny porcelain swans, was found set neatly on the gift table. Not a crumb on them.","Exhibit B: At 3:50 p.m., Duncan was found asleep in the groomsmen's tent with a plastic fork in his breast pocket.","Exhibit C: A smear of lemon buttercream on the cake table's lace cloth, about knee height, on the side facing the barn doors."],"sealed":[{"rules_out":1,"text":"Groomsman's phone video, 3:05 to 3:48 p.m.: Duncan asleep in the tent, snoring, the entire time the cake table was unguarded."},{"rules_out":2,"text":"Kennel check-in slip and GPS collar log: Biscuit was at a boarding kennel across town from 9 a.m. to 7 p.m. on the wedding day."},{"rules_out":3,"text":"Photographer's timestamped shots: Aunt Philippa is front row in every groom's-side group photo from 3:10 to 3:50 p.m."}],"planted":[{"rules_out":0,"text":"Bridal suite door camera: Lorraine goes in at 3:02 p.m. and does not come out until 4:05 p.m., after the cake was found."},{"points_to":2,"text":"Text from the dog sitter, 3:31 p.m.: 'Biscuit got loose near the barn. Got him back, he's fine, just weirdly sticky??'"}],"ruling":"Lorraine slipped out of the bridal suite at 3:15, set the porcelain swans on the gift table, and carried the lemon tier to her trunk, brushing the tablecloth on the way out. She planned to replace it with her own chocolate fudge before anyone noticed. Mothers of the bride don't steal cake. They curate it."},{"id":"indecent-gnomes","tone":"absurd","title":"The Case of the Indecent Gnomes","charge":"Who rearranged Wendell Fogarty's prize gnome collection into a scandalous formation overnight?","story":"For eleven years, Wendell Fogarty's 47 blue-ribbon garden gnomes have stood in tasteful rows on Larkspur Lane. On Tuesday morning they had been rearranged into a formation that, viewed from the street, made the mail carrier drop her coffee. The suspects: Pickles, the neighbor's beagle and a known gnome-dragger; his owner, Lyle Pruitt, two years into a feud with Wendell over 'lawn deposits'; Delphine Crane, Wendell's rival at the garden club; and Marjorie Fogarty, Wendell's wife of 34 years.","verdicts":[{"label":"Pickles the beagle","detail":"Drags gnomes for fun. The 'formation' could be one awful coincidence."},{"label":"Lyle Pruitt, Pickles' owner","detail":"Revenge for the lawn-deposit complaints, done under cover of a dog walk."},{"label":"Delphine Crane, the rival","detail":"Wants Wendell disqualified before the garden club judging."},{"label":"Marjorie Fogarty, his wife","detail":"Has dusted 47 gnomes for 34 years and may have reached her limit."}],"truth":3,"public":["Exhibit A: Three gnomes have tooth marks on their pointed hats. The other 44 are unmarked.","Exhibit B: The garden club's 'Best Yard' judging was set for Wednesday morning. Wendell has won four years running.","Exhibit C: Each gnome was placed on its own flagstone and turned to face the street. Whoever did this took their time."],"sealed":[{"rules_out":0,"text":"Vet discharge sheet, Monday: Pickles is in a cone after surgery. He weighs 19 pounds; each gnome weighs 11. He moved nothing."},{"rules_out":1,"text":"ER wristband and hospital bill: Lyle Pruitt was at County General with a kidney stone from 10 p.m. Monday to 8 a.m. Tuesday."},{"rules_out":2,"text":"Hotel folio: Delphine checked into a lakeside inn 200 miles away Monday at 6:12 p.m. Room service logged at 11:58 p.m."}],"planted":[{"rules_out":3,"text":"Pharmacy label: Marjorie took a prescription sleep aid at 9 p.m. Monday. Wendell swears she 'snored like a leaf blower' till dawn."},{"points_to":1,"text":"Text from Lyle to his brother, Monday 9:52 p.m.: 'Gonna give old Fogarty's little elves a makeover tonight. You'll see.'"}],"ruling":"Marjorie Fogarty waited until Wendell was snoring, then rearranged all 47 gnomes herself, knowing the garden club would declare the display 'unsuitable for a family street.' The tooth marks were Pickles' work from last spring. The gnomes now live in the garage, and Marjorie finally has a patio."},{"id":"royal-eggplant-door","tone":"absurd","title":"The Case of the Royal Eggplant Door","charge":"Who painted the Saddlebrook Pointe clubhouse door a forbidden shade of purple?","story":"The Saddlebrook Pointe clubhouse door was due to be repainted Heritage Taupe, the only door color the HOA covenants allow. On Saturday morning it was a glossy, defiant purple called Royal Eggplant. The suspects: Gordon Teague, who lost his appeal to paint his own door purple; HOA president Carol Bixby, who has fined eleven residents over purple; Rudy, the handyman, who swears he used the can he was given; and Ines Navarro, a new resident and self-described color consultant.","verdicts":[{"label":"Gordon Teague, the appellant","detail":"Lost his purple-door appeal and swore the board 'would see purple.'"},{"label":"Carol Bixby, HOA president","detail":"Make the clubhouse hideous and Thursday's vote to lift the ban dies."},{"label":"Rudy the handyman","detail":"An honest mistake with a mis-tinted can, or a joke he won't admit."},{"label":"Ines Navarro, the newcomer","detail":"Thinks taupe is 'a beige surrender' and has opinions about doors."}],"truth":1,"public":["Exhibit A: A vote to lift the purple ban is set for next Thursday. Gordon Teague gathered 31 signatures to force it.","Exhibit B: The empty can in the clubhouse dumpster is labeled 'Heritage Taupe' in marker. The paint dried on the rim is purple.","Exhibit C: The door got two even coats with a fine brush, and the brass knocker was carefully taped off first."],"sealed":[{"rules_out":0,"text":"Cruise boarding record: Gordon sailed Thursday on a five-night cruise. His wife posted a Friday-night photo captioned 'Gordo vs. the buffet.'"},{"rules_out":2,"text":"Rudy's phone photo, Saturday 6:58 a.m.: the door already purple and dry to the touch before he had opened a single tool bag."},{"rules_out":3,"text":"Airline receipts: Ines flew out Friday at 1 p.m. for her niece's wedding and landed back Sunday night."}],"planted":[{"rules_out":1,"text":"Signed HOA minutes: Carol chaired an emergency budget meeting Friday from 8 p.m. to midnight, then left with the treasurer."},{"points_to":2,"text":"Paint store tint slip, Friday 3:41 p.m.: 'Heritage Taupe, re-tinted per handyman's request. Customer wanted more pop.'"}],"ruling":"Carol Bixby bought the Royal Eggplant herself, wrote 'Heritage Taupe' on the can, and painted the door after midnight with surgical care. She figured one week of staring at a purple clubhouse would crush Thursday's vote. The ban was lifted 34 to 2, and Carol is now fining herself."},{"id":"vanishing-champions-belt","tone":"absurd","title":"The Case of the Vanishing Champion's Belt","charge":"Who took the league's championship belt from the commissioner's basement before the draft party?","story":"The Gridiron Grudge League's trophy is nine pounds of gold-plated belt with a rhinestone eagle. Commissioner Terry Okafor saw it in his basement display case at 8 a.m. on draft day; by 11 it was gone. The suspects: Sal Ferrante, last year's champ, who vowed to keep it 'till they pry it off my waist'; Kevin Dunleavy, nine straight seasons in last place; Marcy Lin, a two-time champion who has griped about the engraving for years; and Rhonda Okafor, Terry's wife, who calls the belt 'the ugliest thing I married into.'","verdicts":[{"label":"Sal Ferrante, last year's champ","detail":"Refuses to hand it back at the draft and has said so loudly."},{"label":"Kevin Dunleavy, last place","detail":"Nine seasons of humiliation. Destroy the belt, end the mockery."},{"label":"Marcy Lin, two-time champ","detail":"Has a grudge against the engraving and knows where the key hangs."},{"label":"Rhonda Okafor, Terry's wife","detail":"Wants it out of her basement, permanently, and lives there."}],"truth":2,"public":["Exhibit A: The display case was opened with its key, not forced. Terry keeps the key on a hook labeled KEY in giant letters.","Exhibit B: A neighbor saw Sal Ferrante's truck parked on Terry's street Friday night 'for no reason at all.'","Exhibit C: The belt's engraved plate lists every champion since the league began. One name is spelled three different ways."],"sealed":[{"rules_out":0,"text":"Sal's girlfriend lives two doors from Terry. Her doorbell camera shows Sal inside from 9 p.m. Friday to 11:30 a.m. Saturday."},{"rules_out":1,"text":"Flight confirmation and a gate selfie: Kevin landed from a work trip at 12:40 p.m. Saturday, after the belt was already gone."},{"rules_out":3,"text":"Spin studio sign-in and a friend's photos: Rhonda was across town from 7:30 to 11:30 a.m. Saturday, then at brunch."}],"planted":[{"rules_out":2,"text":"Gym check-in and a selfie captioned 'Leg day!!' posted 8:14 a.m. Saturday, 25 minutes away, then a 10:30 smoothie receipt."},{"points_to":1,"text":"Pawn shop intake slip, Saturday 11:52 a.m.: 'one belt, gold-tone, eagle, very ugly.' Seller signed K. Dunleavy."}],"ruling":"Marcy Lin dropped by at 9 'with chips,' used the key on the hook labeled KEY, and drove the belt to an engraver, who finally spelled her name right. She meant to have it back by kickoff and nearly did. Never stand between a two-time champion and correct spelling."},{"id":"silent-microphone","tone":"absurd","title":"The Case of the Silent Microphone","charge":"Who sabotaged Dolores Pike's microphone during the karaoke finals at the Salty Flamingo?","story":"At the Salty Flamingo's annual karaoke finals, five-time champion Dolores 'The Velvet Hammer' Pike hit the key change of her signature power ballad, and her microphone went dead. The challenger won by one point. By house rules, the champion drinks free for a year. The suspects: Brandon Kask, the smirking challenger; Vic Santangelo, the owner who pays for those free drinks; Ziggy, the karaoke host at the soundboard; and Lacey Duran, Dolores's estranged former duet partner.","verdicts":[{"label":"Brandon Kask, the challenger","detail":"The only way to beat the Velvet Hammer is to silence her."},{"label":"Vic Santangelo, the owner","detail":"A sixth title means another year of her free top-shelf drinks."},{"label":"Ziggy, the karaoke host","detail":"Has heard that power ballad 300 times and controls every mic."},{"label":"Lacey Duran, ex-duet partner","detail":"Still bitter that Dolores went solo and took the stage name with her."}],"truth":1,"public":["Exhibit A: The wireless mic's battery compartment was found empty. The batteries later turned up in the tip jar on the bar.","Exhibit B: At 9 p.m., Ziggy was overheard saying, 'If she sings that ballad one more time, I'm unplugging the building.'","Exhibit C: Dolores's free bar tab as reigning champion last year: $4,212, almost entirely top-shelf margaritas."],"sealed":[{"rules_out":0,"text":"Judges' sign-in sheet and bar camera: Brandon sat at the judges' table, in plain view, from 9:30 p.m. until Dolores took the stage."},{"rules_out":2,"text":"Camera footage: Ziggy never left the soundboard booth after 9 p.m. The mics were kept behind the bar, 40 feet away."},{"rules_out":3,"text":"Card receipt: Lacey closed her tab and left at 9:12 p.m. Every mic passed the 9:45 p.m. sound check."}],"planted":[{"rules_out":1,"text":"Delivery slip signed by Vic: he was in the alley unloading a beer truck from 9:40 to 10:20 p.m. The driver confirms it."},{"points_to":3,"text":"Text from Lacey to a friend, 9:58 p.m.: 'Done. She's gonna hit that high note and hear nothing but crickets.'"}],"ruling":"Vic Santangelo popped the batteries out behind the bar during the 9:50 rush and dropped them in the tip jar, figuring nobody ever counts that thing. A sixth title would have cost him another $4,000 in margaritas. Some owners protect their margins. Vic unplugged a legend."},{"id":"counterfeit-tide","tone":"serious","title":"The Case of the Counterfeit Tide","charge":"Who replaced Agnes Whitlow's painting 'Low Tide at Brennock' with a forgery?","story":"Agnes Whitlow's 'Low Tide at Brennock' hung in her family's home for 40 years before her nephew loaned it to the Halvorsen Gallery. It went out for cleaning, then onto the gallery wall. On opening night, a visiting conservator shone a UV torch on the signature and went pale: modern pigment. The $2.1 million painting is a fake. The suspects: owner Simon Halvorsen; art handler Teo Marsh, who hung it alone; Gil Whitlow, the nephew; and Imogen Pryce, the restorer who cleaned it.","verdicts":[{"label":"Simon Halvorsen, the owner","detail":"Drowning in debt; sell the original quietly, blame the restorer."},{"label":"Teo Marsh, the art handler","detail":"Alone with the crate at install, with a duplicate ready to hang."},{"label":"Gil Whitlow, the nephew","detail":"Sold the real one years ago and loaned the gallery a copy."},{"label":"Imogen Pryce, the restorer","detail":"Had the painting alone in her studio for six weeks."}],"truth":3,"public":["Exhibit A: Court filings show Halvorsen Gallery is $380,000 behind on rent, and two artists are suing over unpaid sales.","Exhibit B: The forgery's canvas is genuinely old, roughly 1970s. Only the paint is new. Someone had access to period materials.","Exhibit C: A 1982 family photo shows a small chip in the frame's lower left corner. The frame on the gallery wall has the same chip."],"sealed":[{"rules_out":0,"text":"Passport stamps: Simon was at a Lisbon art fair from loan day until opening morning. The alarm log shows nobody touched the painting after install."},{"rules_out":1,"text":"Install camera, 4:02 to 4:31 p.m.: Teo unpacks the crate and hangs the painting in one continuous shot. No second canvas enters."},{"rules_out":2,"text":"Pryce's own intake report, July 9, with UV photos: signature clean, period pigment. The painting Gil loaned was genuine."}],"planted":[{"rules_out":3,"text":"Pryce's outgoing UV photos, Aug. 20, notarized: signature clean, period pigment, matching intake. It left her studio genuine."},{"points_to":1,"text":"Bank record: Teo Marsh deposited $40,000 in cash on Aug. 23, two days after the install. Memo line: 'side job.'"}],"ruling":"Imogen Pryce painted the copy on a 1970s canvas from her own storeroom, fitted it into the original frame, and sealed the crate herself. The real painting now hangs in a private collector's villa, paid for in cash. She cleaned it, all right: right out of the frame."},{"id":"poisoned-sweet-tea","tone":"serious","title":"The Case of the Poisoned Sweet Tea","charge":"Who drugged Hattie Lund's sweet tea at the Pell County Fair pie contest?","story":"Hattie Lund has won the Pell County Fair pie contest eight years running. This year, minutes after the judges tasted her bourbon pecan, she slumped at her booth and spent two nights in the hospital. The lab found a crushed prescription sedative in her thermos of sweet tea. She is recovering, but someone meant it. The suspects: Wade Lund, her ex-husband and landlord; June Albright, eight-time runner-up; Corey Vance, the assistant baker she fired last month; and Darla Knox, her best friend at the next booth.","verdicts":[{"label":"Wade Lund, ex-husband","detail":"Owns her bakery building and has a developer circling it."},{"label":"June Albright, the rival","detail":"Eight years of second place. With Hattie down, the ribbon is hers."},{"label":"Corey Vance, fired assistant","detail":"Fired in front of customers and told everyone she'd 'regret it.'"},{"label":"Darla Knox, best friend","detail":"Right next door, knew the thermos, and nobody watches a best friend."}],"truth":0,"public":["Exhibit A: With Hattie in an ambulance, June Albright took the blue ribbon at last. She cried. Witnesses disagree about which kind.","Exhibit B: Hattie's thermos sat unattended on her booth's back counter from about 1:30 to 2:15 p.m. while she plated for the judges.","Exhibit C: Hattie's calendar for that evening shows one 6 p.m. entry: 'W - sign. DON'T BE LATE.'"],"sealed":[{"rules_out":1,"text":"Tent security camera, 1:15 to 2:30 p.m.: June never leaves her own booth, 60 feet across the tent. Two customers confirm it."},{"rules_out":2,"text":"Time clock records: Corey started a new job two counties over that week and was clocked in from 7 a.m. to 3:30 p.m. on fair day."},{"rules_out":3,"text":"Judges' photos, 1:30 to 2:15 p.m.: Darla stands beside Hattie at the judging table in every shot. She never went back to the booth."}],"planted":[{"rules_out":0,"text":"Fairgrounds gate log: Wade Lund's truck entered the lot at 2:38 p.m., twenty minutes after Hattie took her last sip of tea."},{"points_to":1,"text":"Pharmacy record: June Albright filled a prescription for that exact sedative eight days before the fair. Ninety tablets."}],"ruling":"Wade Lund slipped through the tent's back flap at 1:50 and crushed his own sleeping pills into Hattie's tea. If she missed the 6 p.m. signing, her lease lapsed at midnight and a developer's $1.2 million offer was his. Hattie signed the renewal from her hospital bed, with a nurse as witness: twenty years, locked in."},{"id":"prodigal-trucker","tone":"serious","title":"The Case of the Prodigal Trucker","charge":"Is the man claiming Ambrose Kettering's fortune his lost son Daniel, and if not, who is he?","story":"Shipping magnate Ambrose Kettering died at 91, leaving $14 million 'to my son Daniel, should he ever come home.' Daniel vanished at age four in 1979, when his mother drove off one night and was never seen again. Three months after the funeral, a soft-spoken trucker named Dale Hartley walks into the estate lawyer's office knowing the name of Daniel's stuffed rabbit. Ambrose's longtime nurse, Colette Ames, is not pleased. Is Dale the lost boy, another son entirely, or a very good liar?","verdicts":[{"label":"The real Daniel Kettering","detail":"Taken west as a boy, raised under another name, finally home."},{"label":"Ambrose's other, secret son","detail":"Ambrose's blood, but not Daniel: a child nobody was told about."},{"label":"A con coached by the nurse","detail":"Colette knew the family secrets and fed them to a stranger."},{"label":"A professional con artist","detail":"Worked alone, did his homework, and picked a rich dead man."}],"truth":1,"public":["Exhibit A: Dale knew Daniel's stuffed rabbit was named Captain Buttons. That name was never published anywhere.","Exhibit B: Nurse Colette Ames gets $50,000 under the will, and she was the first to call the lawyer about 'a man asking questions.'","Exhibit C: The Ketterings' live-in housekeeper quit abruptly in late 1975 and moved west. Old staff say she 'left in a family way.'"],"sealed":[{"rules_out":0,"text":"Hospital birth record: Daniel Kettering was born with type O blood. Dale Hartley's blood donor card says type AB."},{"rules_out":2,"text":"Colette Ames started work in 2020. Captain Buttons was lost in 1979, and no photo, letter or record of him survives in the house."},{"rules_out":3,"text":"Background check: Dale has used one name, one address and one trucking job for 33 years. No aliases, no arrests, no prior claims."}],"planted":[{"rules_out":1,"text":"County records: the former housekeeper's only child was stillborn in 1976. Whoever Dale is, he is not her son."},{"points_to":2,"text":"Bank records: Colette Ames wired $9,500 to Dale Hartley two weeks before he first contacted the estate lawyer."}],"ruling":"Dale is Ambrose Kettering's son, just not Daniel: his mother was the housekeeper who left in 1975, and she raised him on stories of the big house, Captain Buttons included. He honestly assumed he was the lost boy. The will names Daniel, so Dale inherits nothing but a father, a missing half-brother, and a very good story."},{"id":"second-wind-grounding","tone":"serious","title":"The Case of the Second Wind Grounding","charge":"Why did the sailboat Second Wind run aground on Cutter's Shoal, and who is to blame?","story":"At 2:10 a.m. on a hazy September night, the 42-foot sloop Second Wind ran hard onto Cutter's Shoal, a sandbar marked on every chart. Owner Grant Ellery and his first mate, Kip Dorsey, were rescued unhurt. The boat was not. Four days later, Grant filed a $380,000 total-loss claim. The insurer wants to know: an honest accident, sabotage by Grant's bitter ex-partner Mitch Corrado, Kip drunk at the helm, or Grant wrecking his own boat?","verdicts":[{"label":"An honest accident","detail":"Haze, a 2 a.m. watch and a depth sounder that glitched all season."},{"label":"Sabotage by Mitch Corrado","detail":"Grant's ex-partner lost a lawsuit to him and once had a boat key."},{"label":"Insurance fraud by Grant","detail":"Second Wind was worth less than his loan. A total loss pays it off."},{"label":"Kip drunk at the helm","detail":"Grant's old friend nodded off, and Grant is covering for him."}],"truth":2,"public":["Exhibit A: The depth sounder went to the repair shop twice that summer. Work order: 'intermittent fault, could not replicate.'","Exhibit B: Rescuers found three empty wine bottles in the cockpit. Kip says they were from dinner. Grant says 'ballast.'","Exhibit C: Second Wind's loan balance was $410,000. A broker had valued her at about $300,000 in the spring."],"sealed":[{"rules_out":0,"text":"Chartplotter memory: autopilot steering to a waypoint dead on Cutter's Shoal, typed in by hand at 11:48 p.m. Shoal alarm switched off at 11:49."},{"rules_out":1,"text":"Mitch's phone location and wedding photos: he was 300 miles inland at his daughter's wedding all weekend. His key was returned in March."},{"rules_out":3,"text":"Coast Guard breath test, 3:05 a.m.: Kip 0.00. Kip says Grant sent him below to sleep at midnight; the cabin camera agrees."}],"planted":[{"rules_out":2,"text":"Kip's sworn statement: 'Grant was asleep below from 11 p.m. I had the helm and I nodded off. It's on me.'"},{"points_to":1,"text":"Marina camera, Thursday 9:14 p.m.: a man matching Mitch Corrado's build boards Second Wind with a toolbox and leaves 20 minutes later."}],"ruling":"Grant Ellery set a waypoint on Cutter's Shoal at 11:48 p.m., sent Kip below to sleep, and let the autopilot do the rest, with a glitchy depth sounder as his alibi. The boat was worth $110,000 less than he owed. The insurer paid nothing, and Grant now owes the bank for a sandbar."},{"id":"gala-shortfall","tone":"serious","title":"The Case of the Gala Shortfall","charge":"Who took the $40,000 missing from the Harbor Lights Literacy Fund's gala account?","story":"The Harbor Lights Literacy Fund's spring gala raised a record $212,000. Six weeks later, the auditor found $40,000 missing from the gala account, sent out in four wires of $10,000 each. The suspects: treasurer Nadine Okoro, 66, a retired schoolteacher who signs every check; executive director Phil Banning, who just bought a fishing boat; gala planner Trish Gale, who handled every vendor; or no insider at all, but a scammer who spoofed the caterer's email.","verdicts":[{"label":"Nadine Okoro, the treasurer","detail":"Holds the bank token and signs everything. Nobody checks her."},{"label":"Phil Banning, the director","detail":"A sudden boat on a nonprofit salary, and access to the books."},{"label":"Trish Gale, the gala planner","detail":"Ran every vendor invoice and could pad or fake a few."},{"label":"An outside email scam","detail":"A fake 'new bank details' email, and the money wired to a crook."}],"truth":0,"public":["Exhibit A: Phil Banning's 'new' boat is a 1998 fishing skiff he named 'Grant Money.' He insists the name is a joke.","Exhibit B: All four wires went to the same overseas bank account. Each was sent on a Tuesday at about 10:15 p.m.","Exhibit C: Colleagues say Nadine has seemed 'happier than in years' since spring, and she keeps her phone face-down at meetings."],"sealed":[{"rules_out":1,"text":"Bank access audit: Phil's login has never opened the gala account. Every wire session came from a device that isn't his."},{"rules_out":2,"text":"Trish's firm was paid one check of $18,400, matching her contract to the penny. The bank confirms she had no portal access."},{"rules_out":3,"text":"The caterer's real invoice was paid by paper check on March 3 and cashed. No wire ever went to any caterer, real or fake."}],"planted":[{"rules_out":0,"text":"Cruise line records: Nadine was at sea with no internet on two of the four Tuesday nights the wires went out. The ship's log confirms it."},{"points_to":3,"text":"Email from 'the caterer,' Feb. 27: 'Please note our NEW banking details for the balance due,' sent from a domain one letter off."}],"ruling":"Nadine Okoro sent all four wires herself, every Tuesday night, to a man she met online who said he was a surgeon stranded overseas. She meant to repay it from her pension before anyone noticed; he never existed. The happiest she'd been in years cost the literacy fund $40,000."},{"id":"letter-in-the-wall","tone":"serious","title":"The Case of the Letter in the Wall","charge":"Who wrote the letter found in the wall, and what really happened to Lorna Vail in 1987?","story":"In 1987, nineteen-year-old Lorna Vail walked out of the Harvest Dance and was never seen again. This spring, house-flippers Dev and Kara Brandt opened a bedroom wall in her childhood home on Alder Street and found a yellowed letter: 'I'm the reason Lorna never came home. I'll carry it to my grave. - R.' Was it Ray Dufresne, the boyfriend she fought with that night, her stepfather Carl Roland Vail, a hoax by flippers who film everything, or her little sister, Rosie?","verdicts":[{"label":"Ray Dufresne, the boyfriend","detail":"Signed 'R'; they fought at the dance; he left town that November."},{"label":"Carl Vail, the stepfather","detail":"Middle name Roland, a known temper, and it was his house."},{"label":"A hoax by the flippers","detail":"Planted a 'confession' to make their renovation videos go viral."},{"label":"Rosie helped her run away","detail":"Lorna left alive. Her sister, 16, helped and kept the secret."}],"truth":3,"public":["Exhibit A: Witnesses at the 1987 dance saw Lorna and Ray arguing by the punch bowl. Ray left town for good that November.","Exhibit B: The letter is in purple felt-tip on lined notebook paper. The handwriting is round and careful, with circles over the i's.","Exhibit C: The Brandts' renovation videos average 4,000 views. The episode about the letter has 2.3 million."],"sealed":[{"rules_out":0,"text":"State crime lab: the letter's handwriting does not match Ray's 1986 school papers or his recent letters. Not even close."},{"rules_out":1,"text":"Hospital records and X-rays: Carl Vail was laid up with two broken legs from a roofing fall from August to December 1987."},{"rules_out":2,"text":"Lab report: paper and ink date to the late 1980s. The plaster sealing it is from a 1988 patch, unbroken until the Brandts' saw."}],"planted":[{"rules_out":3,"text":"State crime lab: the letter's handwriting does not match Rosie Vail's 1987 school essays. Different slant, different letterforms."},{"points_to":0,"text":"A 1987 gas station receipt found in Ray's old truck: two tanks of gas and a shovel, dated the night after the dance."}],"ruling":"Lorna wasn't harmed: she was pregnant, terrified of her stepfather's temper, and sixteen-year-old Rosie walked her to the midnight bus, then hid her guilty confession in the wall during the 1988 re-plastering. Lorna is 58 and lives three states away. She called Rosie the night the video went viral."},{"id":"unbeatable-widower-bingo","tone":"absurd","title":"The Case of the Unbeatable Widower","charge":"Who rigged Tuesday bingo so that Walter Pruitt wins every single week?","story":"Every Tuesday for eleven weeks running, widower Walter Pruitt, 84, has yelled BINGO at Magnolia Gardens Retirement Village before the decaf gets cold, and the canasta ladies want blood. Walter says he just has a lucky card. Caller Doris Fenwick has called numbers for nine years and blushes when he waves. Activities director Glen Okafor needs Walter's five-star review to keep his job. And Walter's son Rodney drops by every Tuesday 'to help set up.'","verdicts":[{"label":"Walter cheats on his own","detail":"Pre-marked cards, a sneaky dauber and eleven weeks of practice."},{"label":"Doris, the smitten caller","detail":"She calls the numbers. She also calls Walter 'a tall drink of water.'"},{"label":"Glen, the activities director","detail":"A happy Walter means a five-star review and a director who keeps his job."},{"label":"Rodney, the helpful son","detail":"Shows up early 'to set up' and has full access to the ball cage."}],"truth":1,"public":["Exhibit A: Walter plays the same faded card, #117, every week and will not let anyone else touch it. 'It knows me,' he says.","Exhibit B: Doris has worn a fresh corsage to every Tuesday bingo since September. No one has seen who sends them.","Exhibit C: The ball cage was bought secondhand from a church raffle in 2009. It squeaks on B-4 and nobody knows why."],"sealed":[{"rules_out":0,"text":"Card audit: #117 is laminated, unmarked and matches the printer's master. Walter's dauber was confiscated in week 9. He won anyway."},{"rules_out":2,"text":"Glen's timesheet and gate log: every Tuesday since August he's been at a 6 p.m. budget meeting across town. Bingo starts at 6:15."},{"rules_out":3,"text":"Lobby camera: Rodney stacks chairs, eats four sugar cookies and leaves at 6:05 every week, before the cage is ever spun."}],"planted":[{"rules_out":1,"text":"Hallway camera: Doris draws every ball with her sleeves rolled up, holds it up to the front row, then drops it in the rack. Clean."},{"points_to":2,"text":"Sticky note found in Glen's desk drawer: 'Keep Walter winning through review season. Five stars = my raise.'"}],"ruling":"Doris never called a single ball. She palmed each one, glanced at card #117, the card she'd memorized over nine years of flirting, and read out Walter's numbers in a lovely, steady voice. Walter had no idea. He thought he was just lucky. In love, he was."},{"id":"mother-in-law-tattoo","tone":"absurd","title":"The Case of the Mother-in-Law Tattoo","charge":"Who arranged the portrait of the groom's mother now permanently on the bride's shoulder?","story":"At a rented lake house, bride-to-be Kelsey Marsh woke Sunday with a palm-sized tattoo on her shoulder: a smiling portrait of her future mother-in-law, Barbara, in pearls. Nobody admits arranging it; maid of honor Tasha booked Saturday's 'mystery entertainment,' and groom's sister Brianna has never warmed to Kelsey. Zeke, the hired 'henna artist,' left before breakfast with a fat cash tip. And Kelsey remembers nothing after the fourth round of something blue.","verdicts":[{"label":"Tasha, the maid of honor","detail":"She booked the 'mystery entertainment' and has a famously dark sense of humor."},{"label":"Brianna, the groom's sister","detail":"Adores her mom, tolerates Kelsey, and would call it 'a sweet tribute.'"},{"label":"Kelsey arranged it herself","detail":"Tequila plus a deep need to win over her future mother-in-law."},{"label":"Zeke the artist went rogue","detail":"Booked for henna, went permanent, pocketed the cash and drove off."}],"truth":2,"public":["Exhibit A: A cocktail napkin from Saturday night, bearing a sketch of a woman in pearls drawn in eyeliner. Artist unknown.","Exhibit B: Brianna's phone lock screen is a photo of her mother wearing those exact pearls.","Exhibit C: Zeke's flyer: 'Henna, glitter and body art. Permanent upgrades available on request.'"],"sealed":[{"rules_out":0,"text":"Tasha's booking with Zeke: 'Two hours, HENNA ONLY, nothing permanent, the bride wears strapless in June.' Paid $180 by card."},{"rules_out":1,"text":"Ride-share receipt: Brianna left the lake house at 9:40 p.m. for a motel 12 miles away. Zeke didn't arrive until 10:30."},{"rules_out":3,"text":"Zeke's shop rules, posted and enforced: no permanent work without a $300 upgrade fee paid by the client. Saturday's fee was paid in full."}],"planted":[{"rules_out":2,"text":"Kelsey's phone: battery hit 1% at 10:02 p.m. and it was dead until morning. Her friends say she was asleep on the couch by 10:15."},{"points_to":0,"text":"Group chat, 11:48 p.m., from Tasha: 'Phase two is a go. Barbara will LOVE it. Delete this.'"}],"ruling":"Kelsey paid the $300 upgrade herself, in cash from her own garter, after a tearful speech about finally winning Barbara over. She sketched the design on a napkin in eyeliner and told Zeke to 'make it last forever.' Barbara has seen it. She wept. She now wants one of Kelsey."},{"id":"boxed-wine-vintage","tone":"absurd","title":"The Case of the Counterfeit Cabernet","charge":"Who swapped Gordon's $2,000 vintage for boxed wine before the wine club tasting?","story":"For six years Gordon Ashby has bragged about his 1971 Chateau Belvoir-Lamarre, a bottle he values at $2,000. Saturday he finally uncorked it for the Cedar Hollow Wine Society, and neighbor Stan Danvers pronounced it 'fruit-forward, with notes of cardboard,' just before a crushed wine box turned up in the recycling. Gordon's wife Marlene rolls her eyes whenever he mentions the bottle. Stan was alone in the den before the guests arrived. And caterer Inez Ruiz handled every bottle that night.","verdicts":[{"label":"Marlene, the weary wife","detail":"Sick of 'the bottle speech'; a collector once offered her $900 for it."},{"label":"Stan, the know-it-all neighbor","detail":"Arrived 40 minutes early and was alone with the wine rack."},{"label":"Inez, the caterer","detail":"Had the corkscrew, the pour, and a cooler full of 'supplies.'"},{"label":"Gordon swapped it himself","detail":"Drank it in secret, refilled the bottle, and hoped nobody could tell."}],"truth":3,"public":["Exhibit A: An empty 5-liter box of 'Porch Swing Red,' crushed flat, found in the Ashbys' recycling bin.","Exhibit B: Stan arrived 40 minutes early 'to let it breathe' and was seen alone in the den beside the wine rack.","Exhibit C: The cork slid out whole, with no crumbling at all. Remarkably fresh for a 55-year-old cork."],"sealed":[{"rules_out":0,"text":"Club photo, Oct 4: foil and tax strip intact. Marlene left on a river cruise Oct 5 and walked in at 7:50 p.m. party night, into a room full of guests."},{"rules_out":1,"text":"Den nanny-cam, 6:20 to 7:00 p.m.: Stan sniffs the bottle, photographs the label and puts it back. He never touches the foil."},{"rules_out":2,"text":"Driveway camera: Inez unloads trays and stays in the kitchen. She never enters the den un
