til Gordon carries the bottle out at 8:05."}],"planted":[{"rules_out":3,"text":"Liquor store loyalty log: no boxed wine ever sold to the Ashby household. Clerk's note on Gordon's account: 'Refuses anything with a spout.'"},{"points_to":1,"text":"Stan's phone, found in the den couch: a search at 6:41 p.m. for 'how to reseal a wine cork so nobody notices.'"}],"ruling":"The night Marlene left on her cruise, Gordon opened the Belvoir-Lamarre alone, drank it with a block of cheddar, and found it tasted mostly like dust. He refilled it from a box, recorked it, and planned to blame the vintage. He forgot that a 55-year-old cork doesn't come out looking brand new."},{"id":"captain-belly-flop","tone":"absurd","title":"The Case of the Captain's Belly-Flop","charge":"Who signed the dignified Captain Merriweather up for the ship's belly-flop contest?","story":"On day four aboard the cruise ship Azure Meridian, the sign-up sheet for the Sunset Belly-Flop Classic gained a new name: Captain Augustin Merriweather, 61, a man who irons his socks. Ship tradition says anyone listed must compete or lose 'the respect of the sea.' First mate Renata Cole has been passed over for promotion twice, and the captain's ex-wife Vivian is aboard 'by pure coincidence.' Entertainment director Dex Lowry's ratings are sinking. And the captain swears he is mortified.","verdicts":[{"label":"The captain signed up himself","detail":"A former college diving champ itching for one last roar from the crowd."},{"label":"Renata, the first mate","detail":"Passed over twice; a viral flop could finally sink his career."},{"label":"Vivian, his ex-wife","detail":"Booked the same cruise 'by coincidence' and has waited years for this."},{"label":"Dex, the entertainment director","detail":"Ratings are down; a captain belly-flop would pack the pool deck."}],"truth":0,"public":["Exhibit A: The entry is written in neat block capitals with a fountain pen, the kind issued to bridge officers.","Exhibit B: Vivian, overheard in the buffet line: 'I hope he hits the water like a dropped piano.'","Exhibit C: Dex's pool-deck shows averaged 14 guests last week. The belly-flop contest drew 600."],"sealed":[{"rules_out":1,"text":"Bridge log: Renata stood watch noon to 8 p.m. without a break. Guest photos show the sheet blank at 2 p.m. and signed by 3."},{"rules_out":2,"text":"Spa receipt: Vivian's 2:00 to 4:00 p.m. 'Total Serenity' mud wrap. She was sealed in seaweed and could not hold a pen."},{"rules_out":3,"text":"Dex's memo to head office, day two: 'Under no circumstances may officers enter guest contests. Insurance will kill us.' Signed."}],"planted":[{"rules_out":0,"text":"Ship's doctor note: Captain Merriweather holds a medical waiver barring all pool activities since a 1998 shoulder surgery."},{"points_to":2,"text":"Activities desk attendant: 'A woman in a huge sun hat asked me how to spell Merriweather. Said it was for an old flame.'"}],"ruling":"The captain signed himself up between 2 and 3 p.m. with his own bridge pen. He had been a college diving champion and quietly missed the roar of a crowd. He feigned horror, 'reluctantly' competed, and scored a perfect ten. The photo now hangs on the bridge."},{"id":"thanksgiving-turkey-vanishes","tone":"absurd","title":"The Case of the Vanishing Turkey","charge":"Who made the 22-pound Thanksgiving turkey disappear twenty minutes before dinner?","story":"At 4:40 p.m., twenty minutes before dinner, the Kowalski family's 22-pound turkey vanished from the kitchen counter, leaving only a greasy pan and a meat thermometer. Uncle Murray had just 'gone for ice.' Cousin Dana, a vegan, has called the bird 'the victim' all day. Next-door neighbor Beverly is locked in a bitter HOA feud with the family over leaf-blowing. And host Linda's husband Mark, assigned to rest the turkey, keeps saying, 'Let's not point fingers.'","verdicts":[{"label":"Uncle Murray took it","detail":"Left 'for ice' with an empty cooler, came back with a very heavy one."},{"label":"Cousin Dana's protest","detail":"A vegan who has been calling the turkey 'the victim' since noon."},{"label":"Mark, the host's husband","detail":"He was in charge of the bird and is awfully eager to move on."},{"label":"Beverly, the feuding neighbor","detail":"HOA revenge: you blow leaves on my lawn, I take your turkey."}],"truth":2,"public":["Exhibit A: A greasy trail runs from the kitchen counter toward the side door and stops at the doormat.","Exhibit B: Uncle Murray's cooler, back from 'getting ice,' is suddenly too heavy for him to lift alone.","Exhibit C: Beverly's note left on the family's windshield Wednesday: 'Blow your leaves on my lawn again and see what happens.'"],"sealed":[{"rules_out":0,"text":"Murray's cooler, opened by Linda at 4:55: forty pounds of ice and nineteen beers labeled 'NOT FOR SHARING.' No turkey. Not even a wing."},{"rules_out":1,"text":"Dana's fitness app: a 4:15 to 5:05 p.m. 'gratitude walk' around the reservoir two miles away, with timestamped photos throughout."},{"rules_out":3,"text":"Her daughter's doorbell camera: Beverly arrives at 2:10 p.m. carrying a pie and doesn't leave until after 7. She was never home."}],"planted":[{"rules_out":2,"text":"Mark's smartwatch, 4:30 to 4:50 p.m.: 31 steps and a resting heart rate of 58. He was asleep in the recliner during the game."},{"points_to":0,"text":"Gas station receipt from Murray's coat, 4:47 p.m.: 'Ice, 2 bags. Jumbo aluminum foil. Carving knife.'"}],"ruling":"Mark carried the bird out the side door to rest it in the cool garage, tripped over the leaf blower, and watched 22 pounds of turkey skate across the concrete. He hid it in the garage freezer and quietly ordered four rotisserie chickens. The leaf blower has been blamed for everything."},{"id":"yacht-and-cats-profile","tone":"absurd","title":"The Case of the Imaginary Yacht","charge":"Who edited Doug's dating profile to claim he owns a yacht and loves cats?","story":"Recently divorced Doug Pemberton, 54, joined the dating app Swoonly with an honest bio: accountant, owns a kayak, allergic to cats. By Friday it read 'Yacht owner. Cat dad. Seeking my first mate,' and he had 212 matches, four proposals, and neither a yacht nor a cat. His ex-wife Sheila still knows all his passwords, and his daughter Megan built the profile 'to help.' His golf buddy Ray dared him to join. And Swoonly just launched 'Spark Assist,' which punches up bios automatically.","verdicts":[{"label":"Sheila, the ex-wife","detail":"Knows every password he has and enjoys watching him squirm."},{"label":"Megan, the helpful daughter","detail":"Built the profile and thinks her dad needs 'more sparkle.'"},{"label":"Ray, the golf buddy","detail":"Dared him to join and has been laughing about it ever since."},{"label":"The app's Spark Assist bot","detail":"An automatic 'bio booster' that may have gotten creative on its own."}],"truth":1,"public":["Exhibit A: Swoonly's records show the edit was made Thursday at 11:52 p.m., from a device logged in as Doug.","Exhibit B: Spark Assist's launch email promises bios that are 'up to 300 percent more boat-forward.'","Exhibit C: Sheila's own new Swoonly profile reads: 'Seeking a man who is honest about his boat.'"],"sealed":[{"rules_out":0,"text":"Airline record: at 11:52 p.m. Thursday Sheila was on a red-eye to Denver in seat 31B, phone in airplane mode, next to a man eating tuna."},{"rules_out":2,"text":"Ray's wife confiscated his phone at 9 p.m. Thursday after 'a fantasy football incident' and locked it in her car overnight. She'll testify."},{"rules_out":3,"text":"Swoonly engineering ticket: Spark Assist is switched off for all users over 50 until December, after it told a retiree to 'lead with the yacht.'"}],"planted":[{"rules_out":1,"text":"Megan's text to Doug, Friday 8 a.m.: 'Dad I swear on Grandma's meatloaf I haven't touched your profile since Tuesday.' No logins from her phone."},{"points_to":0,"text":"Swoonly password-reset email, Thursday 11:40 p.m., sent to the old joint email account Doug and Sheila shared while married."}],"ruling":"Megan logged in from the family tablet at 11:52 p.m. and 'improved' her father, reasoning that a man with a kayak is technically a man with a boat. The cats were aspirational. Doug has since met a lovely woman with two cats and a sailboat. He is taking allergy pills and swimming lessons."},{"id":"missing-mahogany-runabout","tone":"serious","title":"The Case of the Missing Mahogany Boat","charge":"Why is a $60,000 boat titled to a bankruptcy debtor missing from his sworn list of assets?","story":"When Leland Briggs filed Chapter 7 bankruptcy, he listed a pickup, a recliner and $212 in checking. A Chapter 7 trustee sells a debtor's assets to pay creditors, so trustee Patricia Hale went digging and found a marina photo of Leland grinning aboard Miss Behavin’, a restored 1962 mahogany runabout worth about $60,000, still titled in his name. It's not on his sworn schedules. His brother Dale just bought a new boat trailer. And a marina one county over has a mahogany runabout under a tarp in a back slip.","verdicts":[{"label":"Leland hid it from creditors","detail":"Tarped in a back slip one county over, waiting out the bankruptcy."},{"label":"He 'gave' it to brother Dale","detail":"A pre-filing transfer to family, which a trustee can undo."},{"label":"He sold it fair and square","detail":"A real sale at market price, the money spent on bills months ago."},{"label":"It's his ex-wife's boat","detail":"Awarded to her in the divorce; the title was simply never updated."}],"truth":3,"public":["Exhibit A: State title record, printed last week: owner of the vessel Miss Behavin’, 'Leland R. Briggs.' No liens.","Exhibit B: Dale bought a new double-axle boat trailer six weeks before Leland filed for bankruptcy.","Exhibit C: Leland's paperwork mentions a 2024 divorce from Joanne Briggs but lists no details of the property settlement."],"sealed":[{"rules_out":0,"text":"Back-slip rental contract: the tarped runabout belongs to a dentist named Ochoa. It's a 1964, and its hull number doesn't match."},{"rules_out":1,"text":"Dale's new trailer is registered to his own bass boat, photographed sitting on it today. Miss Behavin’ isn't at his home, dock or storage unit."},{"rules_out":2,"text":"Four years of Leland's bank records: no deposit over $3,000, no bill of sale, no buyer. Nobody ever paid Leland for a boat."}],"planted":[{"rules_out":3,"text":"Divorce decree, page 14: 'Husband retains all watercraft, including the vessel Miss Behavin’.' Signed by both parties and the judge."},{"points_to":1,"text":"Text from Leland to Dale, two months before filing: 'Keep her under wraps till this is over. Nobody needs to know she's at your place.'"}],"ruling":"The 2024 divorce decree awarded Miss Behavin’ to Joanne, but nobody filed the title paperwork, so the state still showed Leland. Joanne has kept it at her lake house for two years and renamed it, in fresh gold letters, Alimony. Leland amended his schedules to disclose it, and the trustee let it sail. The only thing he'd hidden was his heartbreak."},{"id":"larkspur-duplex-fire","tone":"serious","title":"The Case of the Larkspur Lane Fire","charge":"How did the vacant half of Victor Hensley's duplex catch fire at 3:10 a.m.?","story":"At 3:10 a.m. on a Sunday, fire gutted the vacant left side of Victor Hensley's duplex on Larkspur Lane; no one was hurt, but the insurer won't pay a dime until it knows whether this was arson. Victor is three months behind on his mortgage and raised his coverage in March. Right-side tenant Corinne Pratt had just been served an eviction notice. Her ex, Kyle Dorsey, is banned from the property but was seen nearby that night. And the city flagged the duplex's 1950s wiring two years ago.","verdicts":[{"label":"Landlord Victor, for the payout","detail":"Behind on his loan, and he raised his fire coverage in March."},{"label":"Corinne, the evicted tenant","detail":"Served an eviction notice days earlier, and she sent a threat."},{"label":"Kyle, the banned ex","detail":"Barred from the property, angry at everyone, and seen nearby."},{"label":"An accident: the old wiring","detail":"1950s wiring the city warned about two years ago finally gave out."}],"truth":0,"public":["Exhibit A: Fire marshal's preliminary report: point of origin is the vacant unit's kitchen, beside a wall outlet.","Exhibit B: Corinne's text to Victor the Tuesday before: 'You'll regret this. Ask around about me.'","Exhibit C: A neighbor's dashcam caught a dark vehicle idling on Larkspur Lane at 2:40 a.m. The plate is unreadable."],"sealed":[{"rules_out":1,"text":"Hospital badge log: Corinne clocked in for a night nursing shift at 7 p.m. Saturday and badged through ward doors every hour until 7 a.m."},{"rules_out":2,"text":"Toll and gas station records: Kyle's car left the state at 1:55 a.m. A pump camera shows him 90 miles away at 3:02 a.m."},{"rules_out":3,"text":"Lab result: gasoline soaked into the kitchen subfloor. The outlet's circuit breaker was switched OFF before the fire started."}],"planted":[{"rules_out":0,"text":"Casino hotel folio: Victor checked in 200 miles away at 9 p.m. Saturday and signed for room service at 2:51 a.m. Receipt attached."},{"points_to":2,"text":"Neighbor's statement: 'Around 2:45 I saw Kyle walking up the back alley with a red gas can. I'd know that ponytail anywhere.'"}],"ruling":"Victor parked his dark sedan around the corner at 2:40, let himself into the vacant unit with his own key, and poured gasoline by the outlet. He flipped the breaker off first so nothing would spark early, never realizing the marshal would check it. The city's wiring warning was supposed to be his alibi. It became his indictment."},{"id":"two-million-dollar-ticket","tone":"serious","title":"The Case of the $2 Million Ticket","charge":"Who really bought the $2 million lottery ticket found in the office pool envelope?","story":"Every Friday, the four-person lottery pool at Tri-County Plumbing Supply chips in $5 apiece, and office manager Dolores Webb buys twenty tickets. This week a ticket in the pool envelope hit for $2 million, and the knives came out. Benny Alvarez says it's his personal ticket, tucked in the envelope 'for luck,' while Priya Shah says it's hers and vanished off her desk. Dolores insists it's a pool ticket, split four ways. And Marcus Bell, who never says anything, has hired a lawyer.","verdicts":[{"label":"A pool ticket Dolores bought","detail":"Twenty tickets, same store, every Friday. Split it four ways."},{"label":"Benny's own personal ticket","detail":"He paid for it alone and tucked it in the envelope for luck."},{"label":"Priya's ticket, swiped","detail":"She says it disappeared from her desk drawer on Thursday."},{"label":"Marcus's own ticket","detail":"The quiet one. Why else would he lawyer up so fast?"}],"truth":1,"public":["Exhibit A: The pool envelope held 21 tickets this week, not the usual 20. Nobody will admit to counting before the drawing.","Exhibit B: Priya filed a note with HR on Thursday: 'Missing: one lottery ticket, my desk, top drawer.'","Exhibit C: Marcus's lawyer's letter is two sentences long and ends, 'My client reserves all rights.'"],"sealed":[{"rules_out":0,"text":"Dolores's receipt: 20 quick-picks, Corner Mart, Fri 7:45 a.m. The winner printed at 6:12 a.m. at a Route 9 gas station, during her spin class."},{"rules_out":2,"text":"Priya's 'missing ticket' turned up Monday in her coat pocket: a $2 scratch-off for a different game. She scratched it at the hearing. A loser."},{"rules_out":3,"text":"Boarding pass: at 6:12 a.m. Friday Marcus was on a flight home from his sister's wedding. He lawyered up because his mother told him to."}],"planted":[{"rules_out":1,"text":"Benny's timecard: clocked in at the warehouse at 5:30 a.m. Friday, 22 miles from Route 9, and didn't clock out until 2 p.m."},{"points_to":2,"text":"Photo on Priya's phone, Thursday 4:58 p.m.: a lottery ticket on her desk. The visible serial digits match the winner's."}],"ruling":"Benny bought the ticket with his own debit card at the Route 9 gas station at 6:12 a.m. on his way to work, then slipped it into the pool envelope for luck, exactly as he said. Legally, it's his. Dolores now has a laminated sign: 'Personal tickets stay personal.' Benny bought everyone lunch. One lunch."},{"id":"willow-bend-hit-and-run","tone":"serious","title":"The Case of the 1 A.M. Hit-and-Run","charge":"Whose car flattened a mailbox and dented a parked SUV on Willow Bend Court at 1:04 a.m.?","story":"At 1:04 a.m., something crunched Nadine Foster's mailbox on Willow Bend Court, left a basketball-sized dent in her parked SUV, and drove off; no one was hurt, but Nadine wants a name. Neighbor Trent Kowal got home from the Tipsy Heron around one. Widow Edna Albright still drives at night despite her doctor's advice, and a delivery driver was spotted making a late run on the street. And Nadine's husband Craig came home from a 'work dinner' at 1:20 and went straight to bed.","verdicts":[{"label":"Trent, home from the bar","detail":"Closing time, a lifted pickup and a very wide turn into the cul-de-sac."},{"label":"Edna, who shouldn't drive at night","detail":"Her silver sedan has a fresh scuff on the front bumper."},{"label":"The late-night delivery driver","detail":"Rushing a 1 a.m. wing order down a dark cul-de-sac."},{"label":"Craig, Nadine's own husband","detail":"Clipped his wife's car on the way in and decided to say nothing."}],"truth":3,"public":["Exhibit A: Paint transfer on the mailbox post is dark blue. The lab can't yet say what make of car it came from.","Exhibit B: Edna's silver sedan has a fresh scuff on its front bumper. She says, 'It was a shopping cart, dear.'","Exhibit C: Neighborhood group chat, 1:07 a.m.: 'Who is revving out there?? Some of us have pickleball at 7.'"],"sealed":[{"rules_out":0,"text":"Bar tab and ride-share receipt: Trent left his truck at the Tipsy Heron and was driven home at 12:51 a.m. The truck is still in their lot."},{"rules_out":1,"text":"Body shop estimate dated last Tuesday: Edna's bumper scuff, 'consistent with shopping cart,' was on file a week before the crash."},{"rules_out":2,"text":"Delivery app log: the only late order on Willow Bend was dropped off at 12:38 a.m. The driver's GPS puts her across town by 12:55."}],"planted":[{"rules_out":3,"text":"Restaurant valet ticket: Craig's car sat in valet until 1:09 a.m., five minutes after the crash, nine miles from Willow Bend."},{"points_to":0,"text":"Doorbell camera across the street, 1:04 a.m.: a lifted pickup, headlights off, backing away from the mailbox. Partial plate: TRK-4."}],"ruling":"Craig left his 'work dinner,' which was poker, and turned onto Willow Bend at 1:04 a.m. feeling very relaxed. He flattened the mailbox, kissed his wife's bumper with his navy sedan, parked around the corner and tiptoed in at 1:20. At breakfast he offered to help find the monster who did this."},{"id":"secret-sauce-leak","tone":"serious","title":"The Case of the Stolen Secret Sauce","charge":"How did Big Earl's 31-year-old secret sauce end up at the rival across the street?","story":"For 31 years, Big Earl's Smokehouse has guarded its Number Nine sauce: tangy, smoky, a little dangerous. Last week Smoke and Mirrors BBQ, directly across Main Street, debuted 'Lucky Seven Sauce,' and blind tasters can't tell the two apart. Line cook Javi Morales quit Earl's in March and now runs the rival's smoker, and bartender Wendy Tran is dating the rival owner's son. Earl's nephew Dmitri owes a bookie $4,000. And both kitchens buy their spices from the same family supplier.","verdicts":[{"label":"Javi, the cook who defected","detail":"Quit in March and now works the rival's smoker across the street."},{"label":"Wendy, the bartender","detail":"Dating the rival owner's son and knows the back office door code."},{"label":"A spice-house mix-up","detail":"Same supplier; a clerk could have shipped Earl's private blend across Main."},{"label":"Dmitri, the nephew in debt","detail":"Owes a bookie $4,000; a rival might pay well for a recipe."}],"truth":2,"public":["Exhibit A: Dmitri's car was booted for unpaid tickets Monday. On Tuesday he paid them off in cash: $1,100.","Exhibit B: The recipe exists in one place only, a laminated card in Earl's office safe. The card is still there.","Exhibit C: The rival's label lists the same 14 ingredients as Earl's, in the very same order."],"sealed":[{"rules_out":0,"text":"Javi's personnel file: fry station only, never taught the sauce. Earl makes it alone on Sundays, door locked. Javi signed a nondisclosure deal."},{"rules_out":1,"text":"Office keypad log, 14 months: Wendy's code has never once opened the office door. She says she only ever wanted the Wi-Fi password."},{"rules_out":3,"text":"Bill of sale and buyer's texts: Dmitri's $1,100 came from selling his jet ski. The rival's books show no payment to Dmitri. He still owes the bookie."}],"planted":[{"rules_out":2,"text":"Spice house invoice: Smoke and Mirrors ordered generic 'Texas Blend #3' and was billed for it. Earl's custom blend ships only to Earl's address."},{"points_to":0,"text":"Text from Javi to the rival owner, Feb 28: 'I got it. Every ingredient. Write me a check and Number Nine is yours.'"}],"ruling":"The rival's new cook phoned the spice house and ordered 'whatever the barbecue place on Main gets.' A new clerk shipped Formula 17, Earl's private blend and the backbone of Number Nine. Add ketchup, vinegar and brown sugar, and you have 'Lucky Seven.' Earl now has a nondisclosure contract with his spice house. The rival can't reorder."},{"id":"country-club-ballot-box","tone":"serious","title":"The Case of the One-Vote Election","charge":"Who cut the seal on the ballot box after a country club election decided by one vote?","story":"Heron Point Country Club's board election ended 112 to 111, keeping president Harold Vance in power for a ninth term. By Monday, challenger Celeste Ambrose had found the ballot box's tamper seal sliced clean through and demanded a new election. Harold's golf buddies ran the sign-in table. Club manager Neil Fairbanks just got a raise from Harold. And a bartender swears a member dropped her car keys through the ballot slot at Saturday's mixer, and somebody opened the box to fish them out.","verdicts":[{"label":"Celeste staged it for a revote","detail":"Lost by one vote; a 'tampered' box could mean a do-over."},{"label":"Harold's camp stuffed the box","detail":"The incumbent kept his seat by exactly one ballot. Convenient."},{"label":"Manager Neil rigged the count","detail":"Harold just renewed his contract and gave him a raise."},{"label":"Innocent: fishing out car keys","detail":"A dropped key ring, a helpful staffer and no fraud at all."}],"truth":0,"public":["Exhibit A: The seal was cut with a single straight slice, like a box cutter or a very sharp letter opener.","Exhibit B: Harold's campaign manager was photographed beside the ballot table at 9:40 p.m., after voting closed at 9.","Exhibit C: Lost-and-found log, Saturday, 11:15 p.m.: 'Car keys, silver fob, owner unknown.'"],"sealed":[{"rules_out":1,"text":"Ballot audit: all 223 ballots match the 223 signatures on the sign-in sheet. Serial numbers run unbroken. Not one extra ballot."},{"rules_out":2,"text":"Count video, 9:00 to 9:50 p.m.: three member tellers count every ballot aloud on camera. Neil never touches a ballot and leaves at 9:05."},{"rules_out":3,"text":"Coat-check attendant's note: the silver key fob was dropped at the coat check, not the ballot box. The ballot slot is a quarter-inch wide."}],"planted":[{"rules_out":0,"text":"Gate log: Celeste's car left Heron Point at 9:58 p.m. Saturday and didn't return until she arrived with her attorney Monday at 10 a.m."},{"points_to":1,"text":"Text from Harold's campaign manager, 9:41 p.m. Saturday: 'Box is handled. Don't ask. Delete this.'"}],"ruling":"Celeste slipped into the board room Sunday night with a vintage letter opener and sliced the seal, betting a 'tampered' box would force a revote. But the tellers had counted on camera, and every ballot matched a signature. Harold keeps his ninth term. Celeste keeps the letter opener, for now."},{"id":"smart-home-birdseed","tone":"absurd","title":"The Case of the 400 Pounds of Birdseed","charge":"Who placed the 3:12 a.m. order for 400 pounds of birdseed through the Pells' kitchen speaker?","story":"Doug and Darlene Pell woke to a delivery truck and 400 pounds of premium wild-bird mix stacked on their driveway. The order went through their kitchen voice assistant at 3:12 a.m. Doug talks in his sleep. Darlene feeds every pigeon on the cul-de-sac. Next door, Glen Huckaby has filed four HOA complaints about their bird feeder and owns a suspicious number of laptops. And in the kitchen sits Admiral, a 22-year-old gray parrot who does a flawless Darlene.","verdicts":[{"label":"Doug, talking in his sleep","detail":"He sleep-talks nightly, and the speaker hears everything."},{"label":"Darlene, feeding her pigeons","detail":"She's the bird lady of the cul-de-sac and the account's main voice."},{"label":"Admiral the parrot","detail":"He mimics Darlene perfectly and has heard 'reorder birdseed' a hundred times."},{"label":"Glen next door, hacking in","detail":"An HOA feud, four complaints, and a lot of laptops."}],"truth":2,"public":["Exhibit A: Order log, 3:12 a.m.: voice matched to profile 'Darlene' at 71% confidence. Item: Wild Bird Feast, 50 lb. Quantity: 8.","Exhibit B: Doug's sleep-clinic file: 'Frequent nocturnal speech, mostly about lawn care.'","Exhibit C: Glen's fourth HOA complaint: 'Their feeder attracts riffraff. I will be taking steps.'"],"sealed":[{"rules_out":0,"text":"CPAP machine log: Doug's mask on and sealed from 1:40 to 5:05 a.m., zero mouth leak. Nobody orders birdseed through a CPAP mask."},{"rules_out":1,"text":"Wi-Fi log: Darlene's phone sat on her sister Bev's home network, 40 miles away, from 8:52 p.m. to 7:30 a.m. She slept at Bev's."},{"rules_out":3,"text":"Glen's doorbell camera: he leaves with a tackle box at 1:05 a.m. and returns at 11:40 a.m. The Pells' router shows no unknown devices."}],"planted":[{"rules_out":2,"text":"Boarding receipt, Feathered Friends Aviary: 'Admiral, gray parrot. Checked in Nov 2, picked up Nov 5.' The order was placed Nov 4."},{"points_to":3,"text":"Router log: device 'GLEN-LAPTOP-3' joined the Pells' Wi-Fi at 3:09 a.m. and dropped off at 3:14 a.m."}],"ruling":"With Darlene at her sister's and Doug sealed under his CPAP, Admiral had the kitchen to himself. He has heard Darlene say 'reorder birdseed' roughly 900 times, and at 3:12 a.m. he said it eight times. The speaker was 71% sure. Admiral was 100% sure. He now says 'Order confirmed' whenever the doorbell rings."},{"id":"bnb-left-socks","tone":"absurd","title":"The Case of the Left-Sock Ghost","charge":"Who, or what, is stealing only left socks from Room 4 of the Larkspur Inn?","story":"For seven months, guests in Room 4 of the Larkspur Inn have woken up one sock short, always the left. Innkeeper Prudence Hale insists it's Captain Ezra Pike, the inn's resident ghost, and bookings have never been better. Handyman Dale Voss sells sock puppets at the Saturday craft fair. And Noodle, the inn's ferret, has a well-known taste for laundry and a nest under the back porch. Somebody is building a collection, one left foot at a time.","verdicts":[{"label":"Captain Pike's ghost","detail":"Legend says he lost his right leg at sea and craves warmth for the left."},{"label":"Prudence, staging a haunting","detail":"A good ghost story fills rooms, and she has the master key."},{"label":"Dale, for his sock puppets","detail":"His puppets need raw material, and he's always fixing Room 4's radiator."},{"label":"Noodle the ferret","detail":"Ferrets hoard socks, and Room 4's closet door has a gap at the floor."}],"truth":1,"public":["Exhibit A: Room 4 guestbook: eleven entries since April report a missing left sock. Right socks reported missing: zero.","Exhibit B: Hallway placard: 'Captain Pike lost his right leg to a shark in 1871. He walks these halls still.'","Exhibit C: Dale's craft-fair price sign: 'Single Sock Puppets, $8. Every one an orphan.'"],"sealed":[{"rules_out":0,"text":"Ship surgeon's log, 1871, county historical society: Captain Pike lost his LEFT leg. A ghost with no left foot has no use for left socks."},{"rules_out":2,"text":"Cruise line manifest: Dale was at sea Aug 3 to 17. The guestbook shows three left socks vanished from Room 4 in those two weeks."},{"rules_out":3,"text":"Noodle's porch nest, dug out Tuesday: two dish towels, an oven mitt, one dog biscuit. Socks: zero. Closet gap measured: half an inch."}],"planted":[{"rules_out":1,"text":"Lock audit: the master key was not used on Room 4 between April and October. Only guests' own keycards opened that door."},{"points_to":2,"text":"Craft-fair photo, June 14: a Dale puppet sewn from an argyle sock monogrammed 'R.T.', matching a Room 4 guest's missing one."}],"ruling":"Prudence Hale is the ghost. At every turndown she took one left sock, because a haunting needs a pattern and a pattern needs discipline. The socks fill a cedar chest labeled 'The Captain's Collection,' and bookings are up 60 percent. She even wrote the hallway placard herself. She just got the leg wrong."},{"id":"garden-show-pumpkin","tone":"absurd","title":"The Case of the Carved Champion","charge":"Who carved the favorite's 1,600-pound pumpkin into the head judge's face the night before judging?","story":"Harlan Fisk's pumpkin, Big Bertha, weighed 1,600 pounds and was a lock for Best in Show at the county garden show. At dawn she was found expertly carved into the face of head judge Myrna Plotz, which got Bertha disqualified. Rival grower Elwood Dunmore has lost to Harlan three years running. Myrna's ex-husband, Ronnie, is a chainsaw sculptor. Night watchman Gus Arbogast took two semesters of art school and won't stop mentioning it. And some say Harlan knew Bertha had a soft spot.","verdicts":[{"label":"Elwood, the bitter rival","detail":"Three straight second places, and a carved pumpkin can't be judged."},{"label":"Harlan, hiding a flaw","detail":"A hidden rot spot means disqualification; sabotage means sympathy."},{"label":"Ronnie, Myrna's ex-husband","detail":"A chainsaw sculptor with unfinished business with the judge."},{"label":"Gus, the night watchman","detail":"He was alone with Bertha all night and has artistic ambitions."}],"truth":2,"public":["Exhibit A: Photos of the carving: detailed and flattering, down to Myrna's beauty mark. She is wearing a small tiara.","Exhibit B: Elwood, overheard at the weigh-in: 'Somebody ought to take a knife to that thing.'","Exhibit C: The barn's security camera was unplugged at 11:58 p.m. Its cord was found tied in a neat bow."],"sealed":[{"rules_out":0,"text":"Hospital discharge papers: Elwood admitted at 10:40 p.m. with a hernia from lifting his own pumpkin. Released 7:15 a.m. Never left the ward."},{"rules_out":1,"text":"Inspector's 6 p.m. report: Bertha 'sound, no soft spots.' Motel lobby video: Harlan singing karaoke from 11 p.m. to 3:50 a.m."},{"rules_out":3,"text":"Gus's watch-clock key: punched at the far gate every 20 minutes, midnight to 6 a.m. The carving took three-plus hours of steady work."}],"planted":[{"rules_out":2,"text":"Tool-rental slip: Ronnie returned his only carving saw Friday at 6 p.m. The rental shop was closed until Monday morning."},{"points_to":0,"text":"Seed analysis: pumpkin pulp found in Elwood's truck bed matches Big Bertha's rare 'Atlantic Titan' strain."}],"ruling":"Ronnie Plotz unplugged the camera, tied the cord in his trademark bow, and spent four hours carving his ex-wife at her most radiant, tiara included. Inside the lid he carved: 'Myrna, take me back.' Harlan is disqualified. Elwood is in traction. Myrna has not said no."},{"id":"chili-ghost-peppers","tone":"absurd","title":"The Case of the Ghost Pepper Chili","charge":"Who spiked the defending champion's chili with ghost peppers before judging?","story":"Earlene Tibbs has won the Fairview Chili Cook-Off four years straight with a recipe her husband Vern calls 'pleasantly medium.' This year three of the four judges took one bite and are still sweating. Rival cook Dwayne Coker has finished second to Earlene every single year. Judge Bernadette Abernathy, the only judge not in distress, has a nephew in the contest. At the shared spice table, a shaker labeled 'Smoked Paprika' was oddly half empty by noon. And Vern has been begging Earlene to retire.","verdicts":[{"label":"Dwayne, the eternal runner-up","detail":"Four second places in a row will do things to a man."},{"label":"Vern, her husband","detail":"He wants her retired, and he had full access to her pot."},{"label":"Judge Bernadette, for her nephew","detail":"The one judge who didn't suffer, with family in the contest."},{"label":"A spice-table accident","detail":"A mislabeled shared shaker, and Earlene grabbed the wrong one."}],"truth":1,"public":["Exhibit A: Lab report: Earlene's pot held about 40 ghost peppers' worth of powder, stirred in thoroughly, not sprinkled on top.","Exhibit B: Judging notes: Bernadette Abernathy 'took a polite half-spoon and set it aside.'","Exhibit C: The shared spice table's 'Smoked Paprika' shaker: full at 9 a.m., half empty by noon."],"sealed":[{"rules_out":0,"text":"Booth camera: Dwayne never leaves his own pot from 9 a.m. to judging at 1 p.m. He made his brother fetch his beer and his lunch."},{"rules_out":2,"text":"Ride-share receipt: Bernadette dropped at the fairgrounds at 12:52 p.m. All pots were lidded and tagged under guard at 12:00 sharp."},{"rules_out":3,"text":"The 'Smoked Paprika' shaker tested as plain paprika. Earlene's handwritten recipe card, underlined twice: 'NO paprika. Ever.'"}],"planted":[{"rules_out":1,"text":"Parking-lot camera: Vern sits in his truck listening to the ballgame from 10 a.m. until the judging bell. He never goes near the tent."},{"points_to":0,"text":"Store receipt found in Dwayne's apron pocket: 'Ghost pepper powder, 8 oz, $14.99,' dated the day before the cook-off."}],"ruling":"Vern Tibbs had booked a nonrefundable cruise leaving the morning after the cook-off, and Earlene had refused to go until she lost. At 11:30, while she waited in the restroom line, he stirred in 40 ghost peppers' worth of powder. She lost. He sails Monday. Earlene says enjoy the cabin, Vern. Alone."},{"id":"golf-hole-in-one","tone":"absurd","title":"The Case of the Disputed Hole-in-One","charge":"Was Reg Thorne's hole-in-one on the 14th genuine, or did the ball get some help?","story":"Reginald 'Reg' Thorne, the most insufferable member of Briar Hollow Country Club, claims an ace on the blind 14th hole: 168 yards, uphill, over a ridge. Nobody saw it drop; his foursome only heard a clunk. His caddie, Benny Lusk, got a $500 tip and bought the bar a round. The groundskeeper has been at war with a gopher on that very green. And Reg's playing partner, Fletcher Doyle, says Reg has 'the best foot wedge in the county.' The plaque committee meets Friday.","verdicts":[{"label":"A genuine ace","detail":"Lucky bounces happen, even to people who don't deserve them."},{"label":"Caddie Benny dropped it in","detail":"He could reach the green first, and Reg tips $500 for an ace."},{"label":"The gopher's handiwork","detail":"Reg's ball went down a gopher hole; an old ball sat in the cup."},{"label":"Reg palmed it himself","detail":"A known cheat, a spare ball in his pocket, and a blind green."}],"truth":0,"public":["Exhibit A: Course map: the 14th green sits below a ridge, invisible from the tee. Witnesses heard only 'a clunk, then Reg screaming.'","Exhibit B: Bar tab, 3:10 p.m.: Benny Lusk, 'a round for the house,' paid in crisp $100 bills.","Exhibit C: Groundskeeper's log: 'Gopher activity, 14th green. Three fresh holes. He is mocking me.'"],"sealed":[{"rules_out":1,"text":"Cart GPS: Benny's cart was stuck at the 13th ball washer until 2:41 p.m. Fletcher pulled the ball from the cup at 2:37."},{"rules_out":2,"text":"The ball in the cup is stamped 'REG #7' from a sleeve opened on the 14th tee. The hole was recut at 6 a.m.; no old ball was in it."},{"rules_out":3,"text":"Fletcher Doyle, under oath, who openly loathes Reg: 'I walked ahead and pulled it out myself. He never reached the green before me.'"}],"planted":[{"rules_out":0,"text":"Launch-monitor data: Reg's longest 7-iron this season is 141 yards. He hit a 7-iron to a 168-yard uphill hole."},{"points_to":1,"text":"Text from Benny to his girlfriend, 2:31 p.m.: 'Running ahead to 14. Big payday incoming.'"}],"ruling":"It was real. Reg thinned a 7-iron, it skipped off the cart path, caromed off a sprinkler head and trickled in. Benny was stuck at a ball washer, the gopher is innocent, and Fletcher had to testify on Reg's behalf. Reg has ordered a plaque. Two plaques."},{"id":"escape-room-bachelor","tone":"absurd","title":"The Case of the Four-Minute Escape","charge":"How did Brent's bachelor party escape the Vault of Doom in four minutes, when the record is 31?","story":"Brent Kowalczyk's bachelor party, six men already two bars in, escaped the Vault of Doom in four minutes and two seconds. The house record was 31 minutes. Best man Travis spent the week bragging he 'had an angle.' Uncle Sal, a retired locksmith, brought a small kit 'for sentimental reasons.' Cousin Howard, a quiet actuary, says he simply saw the pattern. Game master Nico, two weeks on the job, says he gave 'one normal hint.' The bride, Brooke, is just glad they had fun.","verdicts":[{"label":"Travis found the answers online","detail":"A spoiler post for the room had been circulating for weeks."},{"label":"Brooke bribed the game master","detail":"A quick game means an early night for the groom."},{"label":"Uncle Sal picked the locks","detail":"Forty years as a locksmith, and he brought his tools."},{"label":"Cousin Howard is a genius","detail":"Actuaries see patterns. Maybe he really is that good."}],"truth":1,"public":["Exhibit A: Game log: every code entered correctly on the first try. Final vault opened at 4:02. House record: 31:15.","Exhibit B: Uncle Sal's coat-check ticket: 'one leather roll, tools, sentimental.'","Exhibit C: An anonymous forum post, 'Vault of Doom: Full Answers,' logged 300 views in October."],"sealed":[{"rules_out":0,"text":"Owner's work order: every lock code in the Vault was changed Nov 1 after the forum leak. The posted answers fail on all six locks."},{"rules_out":2,"text":"Lock forensics: all six padlocks opened with their own combinations, no scratches. Sal's tool roll never left the coat check."},{"rules_out":3,"text":"Room camera: Howard spends three of the four minutes trying to open a drawer that is painted on the wall."}],"planted":[{"rules_out":1,"text":"Nico's phone records: no calls, texts or payments from Brooke, ever. His only text that night, to his mom: 'Slow shift.'"},{"points_to":2,"text":"Lock forensics: fresh tension-wrench marks on the final vault lock, consistent with a professional pick set."}],"ruling":"Brooke paid Nico $80 to 'help a little' so the bachelor party would end before bar number three. Nico's 'one normal hint' was every code, shown on the hint screen in order. Howard was busy with the painted drawer. Brent was home by 9:15. Brooke calls it the prenup."},{"id":"motel-five-stars","tone":"absurd","title":"The Case of the Five-Star Flophouse","charge":"Who is writing hundreds of glowing anonymous reviews for the worst motel in Gull Harbor?","story":"The Sandpiper Motor Lodge is, by unanimous local opinion, the worst motel in Gull Harbor: the ice machine groans, the carpet has opinions, and the pool is mostly a concept. Yet it has 212 five-star reviews in six months. Owner Merle Gaddis, 74, claims he doesn't know what 'online' is. Tourism director Pam Okafor is mortified. Morning radio host Buzz Fallon keeps reading the reviews on air with a wink. And Merle's daughter Joanie moved across the country nine years ago and hasn't called since.","verdicts":[{"label":"Merle, the owner himself","detail":"Desperate owners write fake reviews every day."},{"label":"Pam, the tourism director","detail":"Boosting the worst motel lifts the whole town's average."},{"label":"Buzz, the radio host","detail":"A running on-air bit needs fresh material every morning."},{"label":"Joanie, the estranged daughter","detail":"Saving Dad's motel from afar, without having to call him."}],"truth":3,"public":["Exhibit A: Sample review: 'The ice machine has a personality. The carpet is honest. Five stars, just like I remember.'","Exhibit B: Timestamps: all 212 reviews were posted between 11 p.m. and 2 a.m., Gull Harbor time.","Exhibit C: Buzz Fallon, on air, Oct 9: 'Who's writing these Sandpiper reviews? Not me, folks.' (Audible wink.)"],"sealed":[{"rules_out":0,"text":"Merle's phone, entered into evidence: a flip phone with no internet. The front-desk computer, from 1998, runs only solitaire and the ledger."},{"rules_out":1,"text":"Pam's emails: two formal requests asking the review site to REMOVE the Sandpiper from Gull Harbor's 'Top Picks.' She wants it buried."},{"rules_out":2,"text":"Buzz's wife, sworn: 'He's asleep by 8:15 for his 4 a.m. show. Snoring. Every night.' Station logs show 4 a.m. sign-ins all year."}],"planted":[{"rules_out":3,"text":"Joanie's text to a friend, March: 'Haven't been on a review site in years. And I'm not doing Dad any favors.'"},{"points_to":0,"text":"Pawn-shop receipt: Merle Gaddis bought a used laptop on April 2, two weeks before the first review appeared."}],"ruling":"Joanie Gaddis, three time zones away, read that the Sandpiper was going under. Every night after her shift she wrote one review from memory of the summers she grew up there, under 212 different names. The ice machine really does have a personality. Merle learned the truth at this hearing and finally called her. Five stars."},{"id":"museum-snuffbox","tone":"serious","title":"The Case of the Vanishing Snuffbox","charge":"Who took the jeweled Ashworth snuffbox during the two-minute blackout at the Hollins House gala?","story":"At 9:14 p.m., during the Hollins House Museum's annual fundraiser, the lights went out. When they came back two minutes later, the 1780 Ashworth snuffbox, gold set with 40 rose-cut diamonds, was gone and the case lid stood open. Curator Dr. Miriam Achebe was about to speak. Board treasurer Philip Rand was standing six feet from the case. A temp server who called himself 'Alex' had joined the caterers that week. And Walt Brennan, the museum's guard for 30 years, retires next month.","verdicts":[{"label":"Dr. Miriam Achebe, the curator","detail":"She holds the case key and knows every inch of the building."},{"label":"Philip Rand, the treasurer","detail":"Steps from the case, and he knows where the breaker room is."},{"label":"'Alex,' the temp server","detail":"New, unknown, and hired under a name nobody can verify."},{"label":"Walt Brennan, the guard","detail":"Thirty years of low pay and one month from a pension."}],"truth":1,"public":["Exhibit A: Building log: power cut at the basement breaker, 9:14 to 9:16 p.m. The basement door normally needs a staff keycard.","Exhibit B: Catering agency file: 'Alex' listed a home address that turned out to be a laundromat.","Exhibit C: Insurer's letter, Oct 30: full appraisal of the Ashworth snuffbox scheduled for the following Tuesday."],"sealed":[{"rules_out":0,"text":"Photographer's flash shot, 9:15:02 p.m.: Miriam frozen on the stage steps, microphone in hand, 60 feet from the case."},{"rules_out":2,"text":"Guest's phone video, 9:14 to 9:17 p.m.: 'Alex' stands motionless by the dish pit, holding a tray of crab cakes, lit by a flashlight."},{"rules_out":3,"text":"Radio log: Walt on channel 2 the entire blackout, at the front doors, ordering 'Nobody leaves.' Three guests place him there."}],"planted":[{"rules_out":1,"text":"Keycard audit: Philip's card was deactivated in August when he left day-to-day duties. It cannot open the basement door."},{"points_to":0,"text":"Text from Miriam's phone at 9:13 p.m. to an unsaved number: 'Now. Kill it now.'"}],"ruling":"Philip Rand quietly sold the real snuffbox to a private buyer last spring and put a paste copy in the case. When the insurer booked an appraisal, he rigged the basement breaker with a $12 timer, waited by the case, and pocketed his own fake in the dark. The museum lost a $400,000 treasure eight months ago. It just found out."},{"id":"missing-hiker","tone":"serious","title":"The Case of the Hiker Who Came Back","charge":"Where was Curtis Lamb really during the three days he was 'lost' in the Ridgeback Wilderness?","story":"Curtis Lamb, 44, set out on a day hike in the Ridgeback Wilderness with his friend Owen Pratt. Owen came out alone. Three days, two helicopters and 60 volunteers later, Curtis limped out at the Fern Gap trailhead with a sprained ankle and a story: he fell, slept in a hollow log, drank from a creek, and was guided out by a stranger in a red jacket. His wife, Donna, wept with relief. The search team noticed he was clean-shaven.","verdicts":[{"label":"Lost, exactly as he says","detail":"People survive worse. The stranger in the red jacket could be real."},{"label":"He staged his own death","detail":"A big insurance policy, cold feet, and a cover story on the way back."},{"label":"Owen left him after a fight","detail":"Curtis is covering for a friend who abandoned him on the trail."},{"label":"Three days with a secret lover","detail":"A wilderness search is the perfect alibi nobody questions."}],"truth":3,"public":["Exhibit A: Ranger's intake note: 'Subject clean-shaven, sunburned on face and forearms only, in surprisingly good spirits.'","Exhibit B: Insurance records: Curtis raised his life policy to $1.2 million in June.","Exhibit C: Owen walked out of the woods at 4 p.m. on day one, but didn't report Curtis missing until 10:15 p.m."],"sealed":[{"rules_out":0,"text ant Tessa Lund, who formats every deck, gave notice the same week. Former IT contractor Ben Haddad left angry when his contract wasn't renewed. And CEO Marcus Vell, the merger's biggest champion, launched a ruthless internal hunt for the traitor.","verdicts":[{"label":"Graham Osei, the CFO","detail":"He fought the merger openly and stood to lose his job."},{"label":"Tessa Lund, the assistant","detail":"She built the deck and was already on her way out."},{"label":"Marcus Vell, the CEO","detail":"A public leak could flush out a richer second bidder."},{"label":"Ben Haddad, the IT contractor","detail":"Bitter about his contract, and he knew the servers cold."}],"truth":2,"public":["Exhibit A: The leaked file is version 14, watermarked 'BOARD ONLY.' Seven people received version 14.","Exhibit B: Graham's email to the board, Oct 3: 'This merger will gut us. I will not be quiet about it.'","Exhibit C: Two days after the story ran, a second bidder appeared. Kestrel's price rose 22 percent."],"sealed":[{"rules_out":0,"text":"Airline records: Graham was on a 14-hour overseas flight with no Wi-Fi when the reporter received the file at 3:22 p.m."},{"rules_out":1,"text":"HR log: at 3:22 p.m. Tessa was in her exit interview, phone locked in the HR cubby per policy. Two HR staff confirm it."},{"rules_out":3,"text":"IT audit: Ben's access was cut Oct 1 and his badge never used again. Version 14 wasn't created until Oct 20."}],"planted":[{"rules_out":2,"text":"Board minutes, signed by six directors: Marcus chaired a meeting from 3:00 to 4:30 p.m. and never left the room."},{"points_to":0,"text":"Reporter's phone log: a 3:05 p.m. call from a prepaid number that also called Graham's wife twice that week."}],"ruling":"Marcus Vell leaked his own deck from his wife's old tablet to flush out a second bidder, and it worked: 22 percent more. Then he launched a leak investigation and lectured Graham, at length, about loyalty."},{"id":"deathbed-will","tone":"serious","title":"The Case of the Caregiver's Inheritance","charge":"Is Eleanor Whitcombe's last-minute will, leaving everything to her caregiver, genuine and truly hers?","story":"Two days before she died at 91, widow Eleanor Whitcombe signed a new will leaving her house, savings and her late husband's coin collection, about $1.4 million, to her caregiver, Janine Dorsey. The old will left it all to her nephew, Clifford, who is contesting. A notary and a neighbor, Fran Tuttle, witnessed the signing in Eleanor's bedroom. Eleanor was in hospice care and on pain medication. Janine had cared for her for four years and was alone with her most days.","verdicts":[{"label":"Forged by Janine","detail":"She knew the signature better than anyone and had every motive."},{"label":"Signed, but not of sound mind","detail":"Ninety-one, in hospice, medicated. Who was really deciding?"},{"label":"Tricked into signing it","detail":"Slipped into a stack of bills, she thought it was something else."},{"label":"Genuine, and she meant it","detail":"Four years of daily care versus a nephew who stopped visiting."}],"truth":3,"public":["Exhibit A: The new signature is shakier than the one on Eleanor's 2019 will, and it slants downhill.","Exhibit B: Hospice chart, two days before her death: 'Morphine increased for comfort.'","Exhibit C: Clifford, deposed: 'I last visited in 2023, but I could tell on the phone she wasn't herself.'"],"sealed":[{"rules_out":0,"text":"Handwriting lab: signature matches Eleanor's, with a tremor consistent with her Parkinson's. No tracing, no pen lifts, no hesitation marks."},{"rules_out":1,"text":"Hospice nurse, that morning: 'Alert, oriented times three. Beat me at gin rummy. Asked if the will appointment was still at 2.'"},{"rules_out":2,"text":"Notary's statement: 'I read the will aloud, every page. She stopped me twice, once to correct the spelling of Janine's last name.'"}],"planted":[{"rules_out":3,"text":"Fran Tuttle's later affidavit: 'Janine held her wrist the whole time, and Eleanor kept asking where Clifford was.'"},{"points_to":0,"text":"Found in Janine's car: a legal pad with 'Eleanor Whitcombe' written 30 times in blue ink."}],"ruling":"Eleanor meant every word. Clifford hadn't visited in three years; Janine did her hair every Sunday and never once asked for a thing. Eleanor told the notary, 'Clifford gets my opinion of him, in writing,' and the will leaves him exactly that: a one-page letter. It does not include the word 'love.'"},{"id":"racehorse-doped","tone":"serious","title":"The Case of the Sleepy Favorite","charge":"Who sedated Midnight Tariff before dawn on the morning of the Silver Bell Stakes?","story":"Midnight Tariff, favorite in the $2 million Silver Bell Stakes at Cardinal Downs, failed his 5 a.m. pre-race blood test: a fast-acting sedative. The colt was scratched, wobbly but unharmed, and recovered fully within 36 hours. Trainer Roy Kessler has handled him since birth. Rival owner Vivian Laird's filly inherited the favorite's spot. Groom Tomas Reyes was seen last week with a bookmaker. And owner Preston Garland, quietly broke, had the colt insured for $3 million.","verdicts":[{"label":"Roy Kessler, the trainer","detail":"He had keys, syringes, and the colt's complete trust."},{"label":"Vivian Laird, the rival owner","detail":"Her filly became the favorite the moment the colt was scratched."},{"label":"Tomas Reyes, the groom","detail":"A bookmaker's money and an all-night barn shift."},{"label":"Preston Garland, the owner","detail":"Broke, and the colt was insured for $3 million."}],"truth":0,"public":["Exhibit A: Vet report: sedative given between 3 and 4:30 a.m. Colt wobbly but stable; fully recovered in 36 hours.","Exhibit B: Photo, last Thursday: Tomas in a diner booth with Lenny 'Lefty' Moss, a known bookmaker.","Exhibit C: Race result: Vivian Laird's filly, Velvet Ledger, won the Silver Bell by a length."],"sealed":[{"rules_out":1,"text":"Flight records: Vivian landed at 6:40 a.m., after the test. Guard log: none of her staff entered the colt's barn overnight."},{"rules_out":2,"text":"Badge log: Tomas clocked out at 9 p.m.; badge unused until 6 a.m. 'Lefty' Moss is his cousin, per both of their mothers."},{"rules_out":3,"text":"Policy clause 14: no payout if a horse is scratched for a positive drug test. A doped colt earns Preston exactly nothing."}],"planted":[{"rules_out":0,"text":"Guard log: Roy's badge out at 10:15 p.m., back in at 5:30 a.m., after the test. Night guard: 'He went home to sleep.'"},{"points_to":2,"text":"Bank alert: $15,000 cash deposit to Tomas Reyes's account at 8:02 a.m. on race day."}],"ruling":"At midnight Roy Kessler felt heat in the colt's left foreleg, the kind that comes before a breakdown. Preston refused to scratch with $2 million on the line, so at 3:30 a.m. Roy gave a sedative he knew the 5 a.m. test would catch. The colt rested, healed, and is sound today. Roy says he'd do it again. The colt has no comment, only carrots."}];</script>

    return pool.slice(0, count);
  }

  function newRoom(seed) {
    return { seed: seed >>> 0, step: 0, log: [], claims: [], leans: [], accuse: [], doubts: [], queue: [], used: {}, shared: {}, strat: {}, nextAt: null, fixTarget: null, round: 1 };
  }

  // ---------- reasoning ----------
  // What player i believes: weights over the four verdicts and suspicion of every other player.
  // How easily a computer juror is swayed: fixed per seat and case, between 0 and 1.
  const gullible = (room, i) => E.makeRng((room.seed >>> 0) + 31337 + i * 7)();
  function assess(room, ctx, i) {
    const n = ctx.roles.length, role = ctx.roles[i], truth = ctx.c.truth;
    const g = gullible(room, i);
    const mine = exhibitOf(ctx, i);
    const s = new Array(n).fill(0);
    const myOut = mine.kind === 'true' ? mine.target : null; // a juror's own exhibit is true, and they know it
    const claims = room.claims.filter(cl => cl.by !== i);
    for (const cl of claims) {
      const p = cl.by;
      if (role === 'insider') {
        if (cl.kind === 'rules_out' && cl.target === truth) s[p] += 5;
        if (cl.kind === 'points_to' && cl.target !== truth) s[p] += 5;
        if (cl.kind === 'rules_out' && cl.target !== truth) s[p] -= 1;
        continue;
      }
      if (cl.kind === 'points_to') { s[p] += 1; if (myOut === cl.target) s[p] += 4; }
      if (cl.kind === 'rules_out' && myOut === cl.target) s[p] -= 1.5;
    }
    // Every verdict ruled out by somebody: the thinnest rule-outs look suspicious.
    const support = [0, 1, 2, 3].map(v => new Set(room.claims.filter(cl => cl.kind === 'rules_out' && cl.target === v).map(cl => cl.by)));
    if (myOut != null) support[myOut].add(i);
    if (role !== 'insider' && support.every(st => st.size > 0)) {
      const minSize = Math.min(...support.map(st => st.size));
      support.forEach((st, v) => { if (st.size === minSize && v !== myOut) st.forEach(p => { if (p !== i) s[p] += 1.2 * (1 - 0.85 * g); }); });
    }
    const weigh = () => {
      const trust = p => Math.max(0.05, Math.min(1.3, 1 - 0.28 * s[p]));
      const w = [1, 1, 1, 1];
      for (const cl of claims) {
        const t = trust(cl.by) * (cl.quoted ? 1 : 0.75);
        if (cl.kind === 'rules_out') w[cl.target] *= (1 - 0.8 * Math.min(1, t));
        else w[cl.target] *= (1 + 0.7 * t);
      }
      for (const ln of room.leans) if (ln.by !== i) w[ln.v] *= (1 + (0.04 + 0.16 * g) * trust(ln.by));
      // Hunches: every juror reads the room a little differently.
      const hr = E.makeRng((room.seed >>> 0) + 9091 + i * 13);
      for (let v = 0; v < 4; v++) w[v] *= Math.exp((hr() * 2 - 1) * (0.35 + 0.9 * g));
      if (myOut != null) w[myOut] = 0;
      if (role === 'insider') { w.fill(0.01); w[truth] = 1; }
      return w;
    };
    let w = weigh();
    if (role !== 'insider') {
      const top = argmax(w);
      for (const cl of claims) {
        if (cl.kind === 'rules_out' && cl.target === top) s[cl.by] += 1;
        if (cl.kind === 'points_to' && cl.target !== top) s[cl.by] += 0.5;
      }
    }
    const trust = p => Math.max(0.05, Math.min(1.3, 1 - 0.28 * s[p]));
    for (const a of room.accuse) {
      if (a.by === i) continue;
      if (a.who === i) s[a.by] += 1.2;
      else s[a.who] += (0.3 + 0.6 * g) * trust(a.by);
    }
    for (const d of room.doubts) {
      if (d.by === i) continue;
      if (d.on === i) s[d.by] += 1;
      else s[d.on] += (0.2 + 0.6 * g) * trust(d.by);
    }
    if (role !== 'insider') w = weigh();
    s[i] = -Infinity;
    return { w, s, top: argmax(w) };
  }
  function argmax(arr, allowed) {
    let best = null;
    (allowed || arr.map((x, k) => k)).forEach(k => { if (best == null || arr[k] > arr[best] + 1e-9) best = k; });
    return best;
  }

  // The verdict a Fixer is pushing.
  function fixerTarget(room, ctx, allowed) {
    const truth = ctx.c.truth;
    const opts = (allowed || [0, 1, 2, 3]).filter(v => v !== truth);
    const pointer = ctx.fixers.map(f => exhibitOf(ctx, f)).find(ex => ex.tag === 'Points to');
    if (pointer && opts.includes(pointer.target)) return pointer.target;
    if (room.fixTarget != null && opts.includes(room.fixTarget)) {
      const outs = new Set(room.claims.filter(cl => cl.kind === 'rules_out' && cl.target === room.fixTarget && !ctx.fixers.includes(cl.by)).map(cl => cl.by));
      if (outs.size < 2) return room.fixTarget;
    }
    let best = opts[0], bestScore = -Infinity;
    for (const v of opts) {
      const outs = new Set(room.claims.filter(cl => cl.kind === 'rules_out' && cl.target === v && !ctx.fixers.includes(cl.by)).map(cl => cl.by)).size;
      const pushes = room.leans.filter(l => l.v === v).length * 0.3;
      const score = -outs + pushes - v * 0.01;
      if (score > bestScore) { best = v; bestScore = score; }
    }
    room.fixTarget = best;
    return best;
  }

  function leanOf(room, ctx, i, allowed) {
    const role = ctx.roles[i], truth = ctx.c.truth;
    if (role === 'fixer') return { v: fixerTarget(room, ctx, allowed), sure: true };
    if (role === 'insider') {
      if (!allowed || allowed.includes(truth)) return { v: truth, sure: true, soft: true };
    }
    const a = assess(room, ctx, i);
    const opts = allowed || [0, 1, 2, 3];
    const v = argmax(a.w, opts);
    const rest = opts.filter(k => k !== v);
    const v2 = rest.length ? argmax(a.w, rest) : v;
    const sure = a.w[v] > a.w[v2] * 1.6;
    return { v, v2, sure };
  }

  function suspectOf(room, ctx, i, rng) {
    const n = ctx.roles.length;
    const others = [...Array(n).keys()].filter(p => p !== i);
    if (ctx.roles[i] === 'fixer') {
      const cands = others.filter(p => !ctx.fixers.includes(p));
      // point at whoever pushes the truth hardest
      const push = cands.map(p => room.leans.filter(l => l.by === p && l.v === ctx.c.truth).length + rng() * 0.8);
      return cands[argmax(push)];
    }
    const a = assess(room, ctx, i);
    const sc = others.map(p => a.s[p] + rng() * 0.3);
    const k = argmax(sc);
    return others[k];
  }

  // A computer seat's sealed ballot.
  function ballot(room, ctx, i, options, seed) {
    const rng = E.makeRng((room.seed >>> 0) + 7777 + i * 131 + (seed || 0));
    const lean = leanOf(room, ctx, i, options);
    let v = lean.v;
    if (ctx.roles[i] === 'juror' && !lean.sure && lean.v2 != null && rng() < 0.35 * gullible(room, i)) v = lean.v2;
    return { v, s: suspectOf(room, ctx, i, rng) };
  }

  // Fixers' guess at the Insider on appeal.
  function appealGuess(room, ctx) {
    const rng = E.makeRng((room.seed >>> 0) + 4242);
    const truth = ctx.c.truth;
    const cands = [...Array(ctx.roles.length).keys()].filter(p => !ctx.fixers.includes(p));
    const sc = cands.map(p => {
      let x = rng() * 1.6;
      x += room.leans.filter(l => l.by === p && l.v === truth).length * 1.2;
      x += room.claims.filter(cl => cl.by === p && cl.kind === 'rules_out' && cl.target !== truth).length * 0.4;
      x += room.accuse.filter(a => a.by === p && ctx.fixers.includes(a.who)).length * 0.8;
      return x;
    });
    return cands[argmax(sc)];
  }

  // ---------- the conversation ----------
  function plan(room, ctx, round, rngSeed) {
    const rng = rngOf(room);
    const ais = E.shuffle(aiSeats(ctx), rng);
    const q = [];
    room.round = round;
    if (round === 1) {
      // Each computer Fixer picks a play: quote the planted exhibit, echo an honest one, or keep quiet.
      const n = ctx.roles.length;
      ctx.fixers.filter(f => ctx.ai[f]).forEach(f => {
        const r = rng(), pointer = exhibitOf(ctx, f).tag === 'Points to';
        if (ctx.fixers.length > 1) room.strat[f] = pointer ? (r < 0.55 ? 'backup' : 'plant') : (r < 0.85 ? 'plant' : 'echo');
        else room.strat[f] = r < 0.6 ? 'plant' : r < 0.9 ? 'echo' : 'quiet';
      });
      if (ais.length) q.push({ k: 'open', by: ais[0] });
      const echoes = ais.filter(p => room.strat[p] === 'echo' || room.strat[p] === 'backup');
      for (const p of ais) if (!echoes.includes(p)) q.push({ k: 'claim', by: p });
      for (const p of echoes) q.push({ k: 'claim', by: p });
      for (const h of humanSeats(ctx)) q.push({ k: 'ask', to: h });
      E.shuffle(ais, rng).forEach(p => q.push({ k: 'lean', by: p }));
      const accusers = E.shuffle(ais, rng).slice(0, Math.min(3, Math.max(1, Math.ceil(ais.length / 2))));
      accusers.forEach(p => q.push({ k: 'accuse', by: p }));
      if (ais.length > 1) q.push({ k: 'banter', by: pick(ais, rng) });
      q.push({ k: 'nudge' });
    } else {
      room.log.push({ by: -1, text: 'Second deliberation. Still standing: ' + room.options.map(v => L[v]).join(' and ') + '.', kind: 'sys' });
      E.shuffle(ais, rng).forEach(p => q.push({ k: 'lean2', by: p }));
      const accusers = E.shuffle(ais, rng).slice(0, Math.min(2, ais.length));
      accusers.forEach(p => q.push({ k: 'accuse', by: p }));
      q.push({ k: 'nudge' });
    }
    room.queue = q;
  }

  // Produce the next line, or null when there is nothing worth saying right now.
  function next(room, ctx) {
    for (let guard = 0; guard < 40; guard++) {
      const it = room.queue.shift();
      if (!it) return filler(room, ctx);
      const line = resolve(room, ctx, it);
      if (line) return line;
    }
    return null;
  }

  function filler(room, ctx) {
    const rng = rngOf(room);
    const ais = aiSeats(ctx);
    if (!ais.length) return null;
    room.fill = (room.fill || 0) + 1;
    const p = pick(ais, rng);
    if (room.fill % 3 === 0) return resolve(room, ctx, { k: room.round === 2 ? 'lean2' : 'lean', by: p });
    if (room.fill % 3 === 1) return say(room, ctx, p, persona(ctx, p).banter, {}, rng, 'banter');
    return resolve(room, ctx, { k: 'nudge' });
  }

  function addClaim(room, ctx, by, ex, quoted) {
    const cl = { by, kind: ex.tag === 'Points to' ? 'points_to' : 'rules_out', target: ex.target, quoted: !!quoted };
    room.claims.push(cl);
    return cl;
  }

  function resolve(room, ctx, it) {
    const rng = rngOf(room);
    const truth = ctx.c.truth;
    switch (it.k) {
      case 'open': return say(room, ctx, it.by, persona(ctx, it.by).open, {}, rng, 'open');
      case 'claim': {
        const p = it.by;
        if (room.shared[p]) return null;
        room.shared[p] = true;
        const ex = exhibitOf(ctx, p);
        if (room.strat[p] === 'quiet') return say(room, ctx, p, T.none, {}, rng, 'none');
        if (room.strat[p] === 'backup' && room.claims.some(cl => ctx.fixers.includes(cl.by) && cl.kind === 'rules_out' && cl.target === truth)) {
          room.claims.push({ by: p, kind: 'rules_out', target: truth, quoted: false });
          return say(room, ctx, p, T.echo, { v: truth }, rng, 'claim', { text: null, kind: 'rules_out', v: truth });
        }
        if (room.strat[p] === 'echo' || room.strat[p] === 'backup') {
          const target = fixerTarget(room, ctx);
          const outs = room.claims.filter(cl => cl.kind === 'rules_out' && cl.target !== truth && cl.target !== target && !ctx.fixers.includes(cl.by)).map(cl => cl.target);
          const v = outs.length ? pick(outs, rng) : [0, 1, 2, 3].find(x => x !== truth && x !== target);
          room.claims.push({ by: p, kind: 'rules_out', target: v, quoted: false });
          return say(room, ctx, p, T.echo, { v }, rng, 'claim', { text: null, kind: 'rules_out', v });
        }
        if (ex.kind === 'none') return say(room, ctx, p, T.none, {}, rng, 'none');
        const cl = addClaim(room, ctx, p, ex, true);
        const line = say(room, ctx, p, cl.kind === 'points_to' ? T.claimPoint : T.claimOut, { v: ex.target }, rng, 'claim', { text: ex.text, kind: cl.kind, v: ex.target });
        room.queue.unshift({ k: 'react', claim: room.claims.length - 1 });
        return line;
      }
      case 'react': {
        const cl = room.claims[it.claim];
        if (!cl) return null;
        const others = E.shuffle(aiSeats(ctx).filter(p => p !== cl.by), rng);
        // someone whose own exhibit contradicts it
        for (const p of others) {
          const ex = exhibitOf(ctx, p), role = ctx.roles[p];
          if (role === 'fixer') continue;
          if (cl.kind === 'points_to' && ex.kind === 'true' && ex.target === cl.target) {
            room.doubts.push({ by: p, on: cl.by });
            return say(room, ctx, p, T.object, { v: cl.target, p: cl.by }, rng, 'object');
          }
        }
        for (const p of others) {
          const role = ctx.roles[p];
          if (role === 'insider' && ((cl.kind === 'rules_out' && cl.target === truth) || (cl.kind === 'points_to' && cl.target !== truth)) && rng() < 0.35) {
            room.doubts.push({ by: p, on: cl.by });
            return say(room, ctx, p, T.insiderDoubt, { p: cl.by }, rng, 'doubt');
          }
          if (role === 'fixer' && !ctx.fixers.includes(cl.by) && cl.kind === 'rules_out' && cl.target === fixerTarget(room, ctx) && rng() < 0.7) {
            room.doubts.push({ by: p, on: cl.by });
            return say(room, ctx, p, T.fixerDoubt, { p: cl.by }, rng, 'doubt');
          }
        }
        for (const p of others) {
          const ex = exhibitOf(ctx, p);
          if (cl.kind === 'rules_out' && ex.tag === 'Rules out' && ex.target === cl.target && room.shared[p]) {
            return say(room, ctx, p, T.corroborate, { v: cl.target, p: cl.by }, rng, 'corroborate');
          }
        }
        if (others.length && rng() < 0.35) return say(room, ctx, others[0], T.noted, {}, rng, 'noted');
        return null;
      }
      case 'ask': {
        const h = it.to;
        if (room.shared[h]) return null;
        const ais = aiSeats(ctx);
        if (!ais.length) return null;
        return say(room, ctx, pick(ais, rng), T.ask, { p: h }, rng, 'ask');
      }
      case 'lean':
      case 'lean2': {
        const p = it.by;
        const allowed = it.k === 'lean2' ? room.options : null;
        const ln = leanOf(room, ctx, p, allowed);
        const prev = room.leans.filter(l => l.by === p).pop();
        if (prev && prev.v === ln.v && it.k === 'lean' && room.fill) {
          return say(room, ctx, p, persona(ctx, p).banter, {}, rng, 'banter');
        }
        room.leans.push({ by: p, v: ln.v });
        if (it.k === 'lean2') {
          const other = allowed.filter(v => v !== ln.v);
          return say(room, ctx, p, T.round2, { v: ln.v, v2: other[0] != null ? other[0] : ln.v }, rng, 'lean2');
        }
        if (ln.soft) return say(room, ctx, p, T.leanSoft, { v: ln.v }, rng, 'lean');
        if (!ln.sure && ln.v2 != null) return say(room, ctx, p, T.leanTorn, { v: ln.v, v2: ln.v2 }, rng, 'lean');
        return say(room, ctx, p, T.leanSure, { v: ln.v }, rng, 'lean');
      }
      case 'accuse': {
        const p = it.by;
        const who = suspectOf(room, ctx, p, rng);
        if (who == null) return null;
        if (ctx.roles[p] !== 'fixer') {
          const a = assess(room, ctx, p);
          if (a.s[who] < 0.5 && rng() < 0.6) return null; // nothing solid to say
        }
        if (room.accuse.some(a => a.by === p && a.who === who)) return null;
        const meFirst = room.accuse.find(a => a.who === p && a.by === who);
        room.accuse.push({ by: p, who });
        const line = say(room, ctx, p, meFirst ? T.accuseMe : T.accuse, { p: who }, rng, 'accuse');
        if (ctx.ai[who]) room.queue.unshift({ k: 'deny', by: who, to: p });
        return line;
      }
      case 'deny': return say(room, ctx, it.by, persona(ctx, it.by).deny.concat(T.deny), { p: it.to }, rng, 'deny');
      case 'pile': {
        const p = it.by;
        const a = ctx.roles[p] === 'fixer' ? null : assess(room, ctx, p);
        if (a && a.s[it.who] < 0.8) return null;
        room.accuse.push({ by: p, who: it.who });
        return say(room, ctx, p, T.pileOn, { p: it.who }, rng, 'pile');
      }
      case 'agree': {
        const p = it.by;
        const ln = leanOf(room, ctx, p, room.round === 2 ? room.options : null);
        room.leans.push({ by: p, v: ln.v });
        if (ln.v === it.v) return say(room, ctx, p, T.agree, { p: it.to, v: it.v }, rng, 'agree');
        return say(room, ctx, p, T.disagree, { p: it.to, v: it.v, v2: ln.v }, rng, 'disagree');
      }
      case 'nudge': {
        const ais = aiSeats(ctx);
        if (!ais.length) return null;
        return say(room, ctx, pick(ais, rng), T.nudge, {}, rng, 'nudge');
      }
      default: return null;
    }
  }

  // A person at the table did something; record it and queue the room's reaction.
  // act: { k: 'share' } | { k: 'claim', kind, target } | { k: 'lean', v } | { k: 'suspect', who } | { k: 'poll' }
  function human(room, ctx, p, act) {
    const rng = rngOf(room);
    const nm = ctx.names[p];
    const ais = E.shuffle(aiSeats(ctx), rng);
    let line = null;
    if (act.k === 'share') {
      const ex = exhibitOf(ctx, p);
      room.shared[p] = true;
      if (ex.kind === 'none') line = { by: p, text: 'My exhibit was thrown out. I’ve got nothing.', kind: 'none' };
      else {
        addClaim(room, ctx, p, ex, true);
        line = { by: p, text: `Here’s my exhibit. It ${ex.tag === 'Points to' ? 'points to' : 'rules out'} ${L[ex.target]}, ${ctx.c.verdicts[ex.target].label}.`, kind: 'claim', ev: { text: ex.text, kind: ex.tag === 'Points to' ? 'points_to' : 'rules_out', v: ex.target } };
        room.queue.unshift({ k: 'react', claim: room.claims.length - 1 });
      }
    } else if (act.k === 'claim') {
      room.shared[p] = true;
      const cl = { by: p, kind: act.kind, target: act.target, quoted: false };
      room.claims.push(cl);
      line = { by: p, text: act.kind === 'points_to' ? `My exhibit points to ${L[act.target]}, ${ctx.c.verdicts[act.target].label}.` : `My exhibit rules out ${L[act.target]}, ${ctx.c.verdicts[act.target].label}.`, kind: 'claim', ev: { text: null, kind: act.kind, v: act.target } };
      room.queue.unshift({ k: 'react', claim: room.claims.length - 1 });
    } else if (act.k === 'lean') {
      room.leans.push({ by: p, v: act.v });
      line = { by: p, text: `I think it’s ${L[act.v]}, ${ctx.c.verdicts[act.v].label}.`, kind: 'lean' };
      if (ais.length) room.queue.unshift({ k: 'agree', by: ais[0], to: p, v: act.v });
    } else if (act.k === 'suspect') {
      room.accuse.push({ by: p, who: act.who });
      line = { by: p, text: `I think ${ctx.names[act.who]} is the Fixer.`, kind: 'accuse' };
      const front = [];
      if (ctx.ai[act.who]) front.push({ k: 'deny', by: act.who, to: p });
      const piler = ais.find(x => x !== act.who);
      if (piler != null) front.push({ k: 'pile', by: piler, who: act.who });
      room.queue.unshift(...front);
    } else if (act.k === 'poll') {
      line = { by: p, text: 'Quick poll. Where’s everybody at?', kind: 'say' };
      room.queue.unshift(...ais.map(x => ({ k: room.round === 2 ? 'lean2' : 'lean', by: x, poll: true })));
      room.fill = 0;
    }
    if (line) { line.text = line.text.replace(/\s+/g, ' ').trim(); room.log.push(line); }
    void nm;
    return line;
  }

  const api = { PERSONAS, pickPersonas, newRoom, plan, next, human, ballot, appealGuess, assess, leanOf };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.JuryBots = api;
})(typeof self !== 'undefined' ? self : this);
</script>

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

    gavel(times) { if (!this.ok()) return; for (let k = 0; k < (times || 1); k++) this.knock(k * 0.32); },
    tick(high) {

    },
    chord(kind) {

      const notes = sets[kind] || sets.good, dur = kind === 'tense' ? 2.2 : 1.6;

    // Voices: only the device's natural voices (Premium, Enhanced, Siri-style or network voices first).
    // Apple's novelty and retro voices (Eloquence: Eddy, Flo, Grandma, Reed, Rocko, Sandy, Shelley;
    // old MacinTalk: Fred, Ralph, Junior, Kathy, Albert and friends) are never used.
    NOVELTY: /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|fred|ralph|junior|kathy|princess|vicki|victoria|agnes|bruce|espeak)\b/i,
    FEM: /\b(samantha|ava|allison|susan|zoe|joelle|noelle|nicky|karen|moira|tessa|fiona|kate|serena|martha|catherine|veena|isha|aria|jenny|zira|sonia|libby|emma|michelle|female|siri voice [24])\b/i,
    MALE: /\b(daniel|alex|tom|evan|nathan|aaron|arthur|gordon|oliver|rishi|lee|guy|davis|david|mark|ryan|male|jamie|siri voice [13])\b/i,
    score(v) {

      if (/neural|natural|siri/i.test(n)) x += 30;
      if (/google/i.test(n)) x += 18;

    },
    voices() {

    gender(v) { const n = v.name + ' ' + (v.voiceURI || ''); return this.FEM.test(n) ? 'f' : this.MALE.test(n) ? 'm' : '?'; },

    castFor(seat) {
      const vs = this.voices();

      if (!this.cast || this.castKey !== key) {
        this.cast = {}; this.castKey = key;

    unlock() { if (!window.speechSynthesis || !S().jurorVoices) return; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ } },
    talk(text, seat, done) {

  try { if (window.speechSynthesis) speechSynthesis.addEventListener('voiceschanged', () => { Sound.cast = null; if (ui.view === 'game' && G && G.phase === 'deliberate') { const t = document.getElementById('voice-tip'); if (t && Sound.quality() === 'great') t.remove(); } }); } catch (e) { /* ignore */ }

  // Keep the screen awake during a trial, when the browser allows it.

  function holdScreen() {

  function newGame(humans, bots) {

  function startCase() {
    const n = G.players.length;
